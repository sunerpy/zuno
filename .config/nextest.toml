# Keep startup telemetry comparable under the workspace-wide parallel runner.
# Nextest executes each test case in its own process, so the in-process lock in
# `crates/zuno-cli/tests/startup.rs` cannot isolate this binary from unrelated
# test binaries. Absolute budgets remain opt-in for stable hosts.
nextest-version = "0.9.103"

[[profile.default.overrides]]
filter = 'binary(startup)'
threads-required = "num-test-threads"

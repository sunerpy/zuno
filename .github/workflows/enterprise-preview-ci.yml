name: Enterprise preview CI

on:
  pull_request:
    branches: [codex/enterprise-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-preview-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  channel:
    name: Preview channel contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Validate channel and publication boundaries
        run: |
          python scripts/enterprise_preview.py check
          python -m unittest discover -s scripts -p 'test_enterprise_*.py' -v
  shared:
    name: Shared native gates
    uses: ./.github/workflows/ci.yml
  postgres:
    name: PostgreSQL contracts
    uses: ./.github/workflows/enterprise-postgres.yml
  docker:
    name: Rootless Docker contracts
    uses: ./.github/workflows/enterprise-docker.yml
  client:
    name: Client contracts
    uses: ./.github/workflows/enterprise-client.yml
  gate:
    name: Enterprise preview gate
    if: always()
    needs: [channel, shared, postgres, docker, client]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all gates
        env:
          CHANNEL: ${{ needs.channel.result }}
          SHARED: ${{ needs.shared.result }}
          POSTGRES: ${{ needs.postgres.result }}
          DOCKER: ${{ needs.docker.result }}
          CLIENT: ${{ needs.client.result }}
        run: test "$CHANNEL" = success && test "$SHARED" = success && test "$POSTGRES" = success && test "$DOCKER" = success && test "$CLIENT" = success

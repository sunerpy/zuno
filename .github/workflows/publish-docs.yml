name: Publish docs

# Pushes this repository's documentation into sunerpy/firlab, which builds and
# publishes zuno.firlab.app.
#
# WHY THE SYNC PUSHES INSTEAD OF THE SITE PULLING
#
# This repository is private; firlab is public. A token stored in firlab that could
# read this repository would be reachable from public workflow contexts — a fork
# pull request, or a workflow edit — and would leak private source. Inverting the
# direction removes that exposure entirely: the credential lives here, in the
# private repository, and grants write access to a public one.
#
# WHAT THIS NEEDS
#
# A secret named `FIRLAB_DOCS_TOKEN`: a fine-grained personal access token scoped
# to `sunerpy/firlab` ONLY, with `Contents: read and write`. It needs nothing else —
# no access to this repository, no workflow scope, no organization permissions.
# GitHub does not expose an API for creating personal access tokens, so this one is
# created by hand.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    name: Push docs to firlab
    runs-on:
      - codebuild-zuno-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - zuno-docs-publish
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Zuno
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zuno
          persist-credentials: false

      - name: Checkout firlab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sunerpy/firlab
          token: ${{ secrets.FIRLAB_DOCS_TOKEN }}
          path: firlab

      # firlab owns the sync script, so the copy rules live with the site that
      # consumes them rather than being duplicated here. Running the site's own
      # script also means a local dry run and this workflow produce the same tree.
      - name: Sync documentation
        run: ./firlab/docs/scripts/sync-zuno-docs.sh "$GITHUB_WORKSPACE/zuno"

      - name: Commit and push
        working-directory: firlab
        env:
          ZUNO_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "documentation is already up to date; nothing to push"
            exit 0
          fi

          # Scoped to the synced tree. `sync-zuno-docs.sh` writes nowhere else, but
          # staging explicitly means an unrelated change in that checkout could
          # never be swept into this commit.
          git add docs/src

          git -c user.name='zuno-docs[bot]' \
              -c user.email='zuno-docs@users.noreply.github.com' \
              commit -m "docs(zuno): sync from zuno@${ZUNO_SHA:0:7}" \
                     -m "Source: https://github.com/sunerpy/zuno/commit/${ZUNO_SHA}"

          git push origin HEAD:main

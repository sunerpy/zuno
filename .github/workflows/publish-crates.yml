name: Publish crates.io

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing published GitHub release tag"
        required: true
        type: string
      auth_mode:
        description: "Publication authentication mode"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published GitHub release tag, for example v0.3.1"
        required: true
        type: string
      auth_mode:
        description: "check packages only, bootstrap with a long-lived token, or use trusted publishing"
        required: true
        default: check
        type: choice
        options:
          - check
          - bootstrap
          - trusted

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate crates.io source packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, manifest, and public GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=crates.io identity::tag must be a complete v* release tag"
            exit 1
          fi
          version=$(
            awk '
              /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )
          if [ "v${version}" != "$TAG" ]; then
            echo "::error title=crates.io identity::${TAG} disagrees with workspace version ${version}"
            exit 1
          fi
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)
          if [ "$(jq -r '.isDraft' <<<"$release")" != false ] \
            || [ "$(jq -r '.tagName' <<<"$release")" != "$TAG" ]
          then
            echo "::error title=crates.io identity::${TAG} is not the exact public GitHub release"
            exit 1
          fi

      - name: Install Rust toolchain
        if: inputs.auth_mode == 'check'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.auth_mode == 'check'
        with:
          shared-key: crates-io
          cache-targets: false

      - name: Package the complete registry dependency closure
        if: inputs.auth_mode == 'check'
        run: python .github/scripts/publish-crates.py --mode check

  bootstrap:
    name: Initial crates.io publication
    if: inputs.auth_mode == 'bootstrap'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: crates-io
          cache-targets: false

      - name: Publish with the bootstrap API token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: python .github/scripts/publish-crates.py --mode publish

      - name: Install the published binary from crates.io
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/zuno-crates-io-install-target
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if cargo install zuno --registry crates-io --version "=${TAG#v}" --locked --root "$root"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          "$root/bin/zuno" --version

  trusted:
    name: Trusted crates.io publication
    if: inputs.auth_mode == 'trusted'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: crates-io
          cache-targets: false

      - name: Exchange GitHub OIDC identity for a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish with trusted publishing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python .github/scripts/publish-crates.py --mode publish

      - name: Install the published binary from crates.io
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/zuno-crates-io-install-target
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if cargo install zuno --registry crates-io --version "=${TAG#v}" --locked --root "$root"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          "$root/bin/zuno" --version

# Pull-request CI for a public repository.
#
# Standard GitHub-hosted runners are isolated, carry no repository secrets on a
# fork's pull_request event, and are free for public repositories. Every required
# job therefore runs for both same-repository and fork pull requests; no AWS role,
# CodeConnection, or privileged self-hosted runner is exposed to submitted code.
#
# GitHub creates pull_request workflow runs for GITHUB_TOKEN-authored PRs in an
# approval-required state. The repository approval policy admits the established
# github-actions bot while still requiring approval for accounts new to GitHub.
# The classify job then routes only the exact same-repository release-please PR
# shape away from these duplicate jobs. release-candidate.yml owns that head's
# real zuno/pr-gate status.

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  BINARY_NAME: zuno

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_pr: ${{ steps.route.outputs.release_pr }}
    steps:
      - name: Route only the trusted release-please PR shape
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          release_pr=false
          if [ "$EVENT_NAME" = pull_request ] \
            && [ "$ACTOR" = 'github-actions[bot]' ] \
            && [ "$PR_USER" = 'github-actions[bot]' ] \
            && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
            && [ "$BASE_REF" = main ] \
            && [[ "$HEAD_REF" == release-please--branches--main--* ]]
          then
            release_pr=true
          fi
          echo "release_pr=${release_pr}" >> "$GITHUB_OUTPUT"
          echo "release_pr=${release_pr}"

  test:
    name: Test
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: nextest@0.9.103

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-deny

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: ripgrep

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install CI tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global oxfmt@0.59.0
          oxfmt --version
          rg --version

      - name: Install and verify sandbox backend
        shell: bash
        run: .github/scripts/setup-linux-sandbox.sh

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Verify lock file and supply chain
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          cargo deny --all-features check

      - name: Format check
        run: make fmt-check

      - name: Clippy
        run: make lint

      - name: Test suite
        run: make test-nextest

  artifact:
    name: Artifact smoke (host)
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: ripgrep

      - name: Install and verify sandbox backend
        shell: bash
        run: .github/scripts/setup-linux-sandbox.sh

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Package and smoke
        run: make smoke-artifact

  windows-clippy:
    name: Windows Clippy
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows-test:
    name: Windows test binaries
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: ripgrep

      - name: Verify runtime dependencies
        shell: bash
        run: rg --version

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Test suite
        shell: bash
        timeout-minutes: 20
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: "off"
          JOBS: "4"
          RUN_DOCTESTS: "0"
          THREADS: "1"
          SUITE_TIMEOUT: "300"
        run: ./scripts/test-parallel.sh

      - name: Upload Windows test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/cargo-timings/
            target/test-parallel/build.log
            target/test-parallel/capture.log
            target/test-parallel/cargo-env.json
            target/test-parallel/artifacts.json
            target/test-parallel/suites.tsv
            target/test-parallel/codes.tsv
            target/test-parallel/doctests.log
            target/test-parallel/logs/
          if-no-files-found: warn
          retention-days: 3

  ci-success:
    name: ${{ needs.classify.outputs.release_pr == 'true' && 'Release PR routed to candidate' || 'zuno/pr-gate' }}
    if: always()
    needs: [classify, test, artifact, windows-clippy, windows-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_PR: ${{ needs.classify.outputs.release_pr }}
        run: |
          set -euo pipefail
          mapfile -t failures < <(
            jq -r --arg release_pr "$RELEASE_PR" '
              to_entries
              | sort_by(.key)
              | .[]
              | select(
                  if .key == "classify" then
                    .value.result != "success"
                  elif $release_pr == "true" then
                    .value.result != "skipped"
                  else
                    .value.result != "success"
                  end
                )
              | "\(.key)=\(.value.result // "<missing>")"
            ' <<<"$NEEDS_JSON"
          )
          if [ "${#failures[@]}" -ne 0 ]; then
            printf 'required CI job failed: %s\n' "${failures[@]}"
            exit 1
          fi
          if [ "$RELEASE_PR" = true ]; then
            echo "release-please PR is delegated to release-candidate.yml"
          else
            echo "all required CI jobs succeeded"
          fi

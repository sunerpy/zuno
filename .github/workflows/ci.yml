# Pull-request CI for a public repository.
#
# Standard GitHub-hosted runners are isolated, carry no repository secrets on a
# fork's pull_request event, and are free for public repositories. Every required
# job therefore runs for both same-repository and fork pull requests; no AWS role,
# CodeConnection, or privileged self-hosted runner is exposed to submitted code.
#
# GitHub creates pull_request workflow runs for GITHUB_TOKEN-authored PRs in an
# approval-required state when GitHub's native policy asks for it. A maintainer
# reviews and approves that run; the project deliberately does not bypass it with
# skip markers, pull_request_target, or a privileged automation token. Once GitHub
# admits a run, the classify job routes only the exact same-repository
# release-please PR shape away from duplicate build jobs. release-candidate.yml
# owns that head's real zuno/pr-gate status.

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "false"
  RUSTC_WRAPPER: sccache
  BINARY_NAME: zuno

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_pr: ${{ steps.route.outputs.release_pr }}
      ci_tooling: ${{ steps.tooling.outputs.needed || 'false' }}
    steps:
      - name: Route only the trusted release-please PR shape
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          release_pr=false
          if [ "$EVENT_NAME" = pull_request ] \
            && [ "$PR_USER" = 'github-actions[bot]' ] \
            && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
            && [ "$BASE_REF" = main ] \
            && [[ "$HEAD_REF" == release-please--branches--main--* ]] \
            && jq -e 'index("autorelease: pending") != null' <<<"$PR_LABELS" >/dev/null
          then
            release_pr=true
          fi
          echo "release_pr=${release_pr}" >> "$GITHUB_OUTPUT"
          echo "release_pr=${release_pr}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.route.outputs.release_pr != 'true'
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select native CI-tooling checks
        if: steps.route.outputs.release_pr != 'true'
        id: tooling
        shell: bash
        run: |
          set -euo pipefail
          needed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git rev-parse HEAD^1 >/dev/null 2>&1; then
            git diff --no-ext-diff --no-textconv --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/ci-changed-paths"
            needed=false
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/*|.cargo/*|scripts/*|Makefile|Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/zuno-cli/tests/release_surface.rs)
                  needed=true
                  ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  ci-cache-seed:
    name: Optional cache transport seed
    needs: classify
    if: needs.classify.outputs.ci_tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Create a portable cache fixture
        run: |
          mkdir -p target/ci-cache/compiler
          printf 'zuno cache transport v1\n' > target/ci-cache/compiler/transport.txt
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: target/ci-cache/compiler
          key: zuno-cache-transport-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  ci-tools:
    name: CI tools (${{ matrix.runner }})
    needs: classify
    if: needs.classify.outputs.ci_tooling == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
          - windows-11-arm
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Verify native process and cache contracts
        shell: bash
        run: |
          python -c "import os,platform; expected={'X64':('amd64','x86_64'),'ARM64':('arm64','aarch64')}; assert platform.machine().lower() in expected[os.environ['RUNNER_ARCH']]"
          python -m unittest discover -s scripts -p 'test_ci_*.py' -v
      - name: Restore the Linux-written transport fixture
        id: transport
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: target/ci-cache/compiler
          key: zuno-cache-transport-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Verify available cache transport
        if: steps.transport.outputs.cache-hit == 'true'
        shell: bash
        run: |
          python -c "from pathlib import Path; assert Path('target/ci-cache/compiler/transport.txt').read_bytes() == b'zuno cache transport v1\n'"
          echo "Cache transport: verified (Linux to $RUNNER_OS / $RUNNER_ARCH)." >> "$GITHUB_STEP_SUMMARY"
      - name: Record unavailable cache probe
        if: steps.transport.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::notice::Cache transport was not exercised: the optional cache entry was unavailable. Native process and cache contract tests ran independently."
          echo "Cache transport: not exercised (cache miss or service error)." >> "$GITHUB_STEP_SUMMARY"

  linux-static:
    name: Linux static checks
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install CI tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global oxfmt@0.59.0
          oxfmt --version

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Verify lock file and supply chain
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          cargo deny --all-features check

      - name: Format check
        run: make fmt-check

      - name: Clippy
        run: make lint

      - name: Preserve build diagnostics
        if: always()
        uses: ./.github/actions/compiler-cache-report
        with:
          name: linux-static-build-${{ github.run_id }}-${{ github.run_attempt }}

  linux-test:
    name: Linux tests
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false
          cache-bin: false

      - name: Restore compiler cache
        id: cache
        uses: ./.github/actions/compiler-cache
        with:
          slot: pr-linux-tests

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: nextest@0.9.103

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: ripgrep

      - name: Install and verify sandbox backend
        shell: bash
        run: .github/scripts/setup-linux-sandbox.sh

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Test suite
        run: make test-nextest

      - name: Sandbox boundary suite
        shell: bash
        env:
          ZUNO_SANDBOX_E2E_REQUIRE: "1"
        run: make test-sandbox-e2e

      - name: Preserve build diagnostics
        if: always()
        uses: ./.github/actions/compiler-cache-report
        with:
          name: linux-test-build-${{ github.run_id }}-${{ github.run_attempt }}

  artifact:
    name: Artifact smoke (host)
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false
          cache-bin: false

      - name: Restore compiler cache
        id: cache
        uses: ./.github/actions/compiler-cache
        with:
          slot: pr-host-release

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: ripgrep

      - name: Install and verify sandbox backend
        shell: bash
        run: .github/scripts/setup-linux-sandbox.sh

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Package and smoke
        run: make smoke-artifact

      - name: Preserve build diagnostics
        if: always()
        uses: ./.github/actions/compiler-cache-report
        with:
          name: artifact-build-${{ github.run_id }}-${{ github.run_attempt }}

  windows-clippy:
    name: Windows Clippy
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --timings -- -D warnings

      - name: Preserve build diagnostics
        if: always()
        uses: ./.github/actions/compiler-cache-report
        with:
          name: windows-clippy-build-${{ github.run_id }}-${{ github.run_attempt }}

  windows-test:
    name: Windows test binaries
    needs: classify
    if: needs.classify.outputs.release_pr != 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-home-${{ runner.os }}-${{ runner.arch }}
          cache-targets: false
          cache-bin: false

      - name: Restore compiler cache
        id: cache
        uses: ./.github/actions/compiler-cache
        with:
          slot: pr-windows-tests

      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: ripgrep

      - name: Test Windows installer on PowerShell 5.1 and 7
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -File scripts/test-install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -File scripts/test-install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime dependencies
        shell: bash
        run: rg --version

      - name: Populate the cargo registry
        run: cargo fetch --locked

      - name: Test suite
        shell: bash
        timeout-minutes: 20
        env:
          JOBS: "4"
          RUN_DOCTESTS: "0"
          THREADS: "1"
          SUITE_TIMEOUT: "300"
        run: ./scripts/test-parallel.sh

      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/cargo-timings/
            target/test-parallel/build.log
            target/test-parallel/capture.log
            target/test-parallel/artifacts.json
            target/test-parallel/suites.tsv
            target/test-parallel/codes.tsv
            target/test-parallel/doctests.log
            target/test-parallel/startup.log
            target/test-parallel/logs/
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve build diagnostics
        if: always()
        uses: ./.github/actions/compiler-cache-report
        with:
          name: windows-test-build-${{ github.run_id }}-${{ github.run_attempt }}

  ci-success:
    name: ${{ needs.classify.outputs.release_pr == 'true' && 'Release PR routed to candidate' || 'zuno/pr-gate' }}
    if: always()
    needs: [classify, ci-tools, linux-static, linux-test, artifact, windows-clippy, windows-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_PR: ${{ needs.classify.outputs.release_pr }}
          CI_TOOLING: ${{ needs.classify.outputs.ci_tooling }}
        run: |
          set -euo pipefail
          mapfile -t failures < <(
            jq -r --arg release_pr "$RELEASE_PR" --arg ci_tooling "$CI_TOOLING" '
              to_entries
              | sort_by(.key)
              | .[]
              | select(
                  if .key == "classify" then
                    .value.result != "success"
                  elif $release_pr == "true" then
                    .value.result != "skipped"
                  elif .key == "ci-tools" and $ci_tooling != "true" then
                    .value.result != "skipped"
                  else
                    .value.result != "success"
                  end
                )
              | "\(.key)=\(.value.result // "<missing>")"
            ' <<<"$NEEDS_JSON"
          )
          if [ "${#failures[@]}" -ne 0 ]; then
            printf 'required CI job failed: %s\n' "${failures[@]}"
            exit 1
          fi
          if [ "$RELEASE_PR" = true ]; then
            echo "release-please PR is delegated to release-candidate.yml"
          else
            echo "all required CI jobs succeeded"
          fi

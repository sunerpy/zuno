name: Prepare Codex upstream sync

# Watches openai/codex for new stable `rust-vX.Y.Z` releases and keeps exactly
# one review PR per release current against `main`, replaying releases in
# order so every Codex release becomes a Zuno release. Merging the candidate PR
# is the review gate: manual by default, or queued for GitHub auto-merge behind
# the PR gate when `[sync].automatic_merge = true` in UPSTREAM_CODEX.toml.
# After the merge `zuno-release.yml` promotes the already-built candidate bytes.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact stable Codex tag (blank selects newest stable tag)
        required: false
        type: string
      refresh:
        description: Re-prepare the candidate even if the open PR already matches main
        required: false
        type: boolean
        default: false
      policy:
        description: Which stable tag to sync when target is blank (next = every release in order, newest = skip to the latest)
        required: false
        type: choice
        options: [next, newest]
        default: next
  schedule:
    # Poll every six hours; upstream stable releases are irregular. Off the hour
    # to avoid the top-of-hour rush.
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: zuno-upstream-sync-main
  cancel-in-progress: false

env:
  CANDIDATE_LABEL: upstream-sync
  CONFLICT_LABEL: upstream-sync-conflict
  # The checkout gains an `upstream` remote pointing at openai/codex, and gh
  # prefers a remote named upstream when inferring the repository. Pin every gh
  # call to this repository so labels, issues, and PRs never target upstream.
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Regenerating schema fixtures compiles the protocol and config crates.
    timeout-minutes: 90
    steps:
      - name: Check out exact Zuno source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Codex release tags
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/openai/codex.git
          git fetch --tags --prune upstream

      - name: Validate sync helper
        run: python3 -m unittest -v scripts/test_zuno_upstream.py

      - name: Resolve the stable release to sync
        id: plan
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          POLICY: ${{ inputs.policy || 'next' }}
        run: |
          set -euo pipefail
          plan_path="${RUNNER_TEMP}/upstream-plan.json"
          # Releases are replayed in order, but a candidate branch that is
          # already open (pushed and not yet merged into main) for a newer
          # release, for example one resolved by hand, is never regressed to an
          # older tag; the helper discovers those from origin and ignores merged
          # ones. Superseded candidates are deleted from origin (below), so a
          # closed PR does not leave a branch that keeps steering the target.
          target_args=(--policy "${POLICY}" --open-candidates-remote origin)
          if [[ -n "${REQUESTED_TARGET}" ]]; then
            target_args=(--target "${REQUESTED_TARGET}")
          fi
          python3 scripts/zuno_upstream.py \
            --no-fetch \
            --json \
            check \
            --allow-current \
            --source HEAD \
            "${target_args[@]}" > "${plan_path}"
          cat "${plan_path}"
          status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", "plan"))' "${plan_path}")"
          if [[ "${status}" == current ]]; then
            baseline="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["baseline_tag"])' "${plan_path}")"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Baseline ${baseline} is already the newest stable Codex release; nothing to prepare." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          target_tag="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["target_tag"])' "${plan_path}")"
          relationship="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["relationship"])' "${plan_path}")"
          source_dirty="$(python3 -c 'import json, sys; print(str(json.load(open(sys.argv[1]))["source_dirty"]).lower())' "${plan_path}")"
          [[ "${relationship}" == descendant || "${relationship}" == release-branch ]] || {
            echo "unsafe upstream relationship: ${relationship}" >&2
            exit 1
          }
          [[ "${source_dirty}" == false ]] || {
            echo "reviewed Zuno source is dirty" >&2
            exit 1
          }
          target_version="${target_tag#rust-v}"
          if [[ ! "${target_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsafe target returned by sync helper: ${target_tag}" >&2
            exit 1
          fi
          {
            echo "skip=false"
            echo "target_tag=${target_tag}"
            echo "target_version=${target_version}"
            echo "plan_path=${plan_path}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "branch=upstream-sync/${target_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Inspect existing candidate and conflict report
        id: state
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          gh label create "${CANDIDATE_LABEL}" --force --color 0E8A16 \
            --description "Codex upstream release candidate prepared by automation" >/dev/null
          gh label create "${CONFLICT_LABEL}" --force --color B60205 \
            --description "Codex upstream candidate needs manual conflict resolution" >/dev/null

          remote_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          pr_json="$(gh pr list --state open --head "${BRANCH}" --base main --json number,body,headRefOid --limit 1)"
          pr_number="$(jq -r '.[0].number // empty' <<<"${pr_json}")"
          pr_source="$(jq -r '.[0].body // ""' <<<"${pr_json}" | sed -n 's/^Zuno-Source-Commit: \([0-9a-f]\{40\}\)$/\1/p' | head -n1)"

          issue_json="$(gh issue list --state open --label "${CONFLICT_LABEL}" --search "\"${TARGET_TAG}\" in:title" --json number,body --limit 1)"
          issue_number="$(jq -r '.[0].number // empty' <<<"${issue_json}")"
          issue_source="$(jq -r '.[0].body // ""' <<<"${issue_json}" | sed -n 's/^Zuno-Source-Commit: \([0-9a-f]\{40\}\)$/\1/p' | head -n1)"

          action=prepare
          if [[ -n "${pr_number}" && "${pr_source}" == "${SOURCE_SHA}" && "${REFRESH}" != true ]]; then
            action=skip
            echo "Candidate PR #${pr_number} already replays main@${SOURCE_SHA} onto ${TARGET_TAG}; nothing to do." >> "${GITHUB_STEP_SUMMARY}"
          elif [[ -n "${issue_number}" && "${issue_source}" == "${SOURCE_SHA}" && "${REFRESH}" != true ]]; then
            action=skip
            echo "Conflict issue #${issue_number} already describes main@${SOURCE_SHA} onto ${TARGET_TAG}; waiting for manual resolution." >> "${GITHUB_STEP_SUMMARY}"
          fi
          {
            echo "action=${action}"
            echo "remote_sha=${remote_sha}"
            echo "pr_number=${pr_number}"
            echo "issue_number=${issue_number}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare isolated candidate
        id: candidate
        if: steps.plan.outputs.skip != 'true' && steps.state.outputs.action == 'prepare'
        env:
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
          TARGET_VERSION: ${{ steps.plan.outputs.target_version }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          PLAN_PATH: ${{ steps.plan.outputs.plan_path }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          # Nested inside the checkout so the Rust cache action can key on it.
          candidate="${GITHUB_WORKSPACE}/.zuno-candidate"
          candidate_report="${RUNNER_TEMP}/upstream-candidate.json"
          # A candidate that was already finalized for this release (by an
          # earlier run or by hand) carries reviewed post-merge edits: conflict
          # resolutions, API adaptations, deletions. `prepare --reuse` copies
          # them for every path main has not changed since, so a moving main
          # does not undo that work.
          reuse=()
          if [[ -n "${REMOTE_SHA}" ]] && git fetch --quiet origin "refs/heads/${BRANCH}" && git cat-file -e "${REMOTE_SHA}^{commit}" 2>/dev/null; then
            target_commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["target_commit"])' "${PLAN_PATH}")"
            second_parent="$(git rev-parse --verify --quiet "${REMOTE_SHA}^2" || true)"
            if [[ -n "${second_parent}" && "${second_parent}" == "${target_commit}" ]]; then
              reuse=(--reuse "${REMOTE_SHA}")
              echo "Reusing conflict resolutions from candidate ${REMOTE_SHA} (source $(git rev-parse "${REMOTE_SHA}^1"))."
            else
              echo "Existing branch head ${REMOTE_SHA} is not a finalized candidate for ${TARGET_TAG}; not reusing it."
            fi
          fi
          set +e
          python3 scripts/zuno_upstream.py \
            --no-fetch \
            --json \
            prepare \
            --source HEAD \
            --target "${TARGET_TAG}" \
            --branch "${BRANCH}" \
            --worktree "${candidate}" \
            "${reuse[@]}" > "${candidate_report}"
          prepare_exit=$?
          set -e
          cat "${candidate_report}"
          status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "${candidate_report}")"
          if [[ "${prepare_exit}" -ne 0 ]]; then
            [[ "${status}" == conflict ]] || {
              echo "candidate preparation failed without a conflict report" >&2
              exit "${prepare_exit}"
            }
            {
              echo "outcome=conflict"
              echo "report=${candidate_report}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          upstream_commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["target_commit"])' "${candidate_report}")"
          {
            echo "outcome=candidate"
            echo "candidate=${candidate}"
            echo "report=${candidate_report}"
            echo "upstream_commit=${upstream_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain for derived artifacts
        if: steps.candidate.outputs.outcome == 'candidate'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Restore Rust build cache for derived artifacts
        if: steps.candidate.outputs.outcome == 'candidate'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .zuno-candidate/codex-rs
          shared-key: zuno-upstream-sync
          cache-bin: false

      - name: Regenerate derived artifacts and finalize candidate
        if: steps.candidate.outputs.outcome == 'candidate'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          TARGET_VERSION: ${{ steps.plan.outputs.target_version }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Derived artifacts (Cargo.lock, App Server schema fixtures, config
          # schema) are rebuilt from the merged source instead of merged as
          # text; the PR gate checks the schema fixtures for drift.
          (
            cd "${CANDIDATE}/codex-rs"
            cargo update --workspace
            python3 app-server-protocol/scripts/write_schema_fixtures.py
            python3 app-server-protocol/scripts/write_schema_fixtures.py --experimental
            cargo run -q -p codex-config-schema --bin codex-write-config-schema
          )
          # finalize commits the candidate as a merge whose first parent is the
          # reviewed main commit and whose second parent is the exact upstream
          # release, so the PR merges trivially and promotion can verify both.
          git -C "${CANDIDATE}" config user.name github-actions[bot]
          git -C "${CANDIDATE}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 scripts/zuno_upstream.py --json finalize \
            --worktree "${CANDIDATE}" \
            --source "${SOURCE_SHA}" \
            --message "chore(upstream): merge Codex ${TARGET_VERSION} into Zuno"
          git -C "${CANDIDATE}" show --stat --format='%H %P%n%s' HEAD | head -n 40

      # Pushes and pull requests made with the default GITHUB_TOKEN do not
      # trigger `pull_request` workflows, so the PR gate would never run on the
      # candidate. Configure the ZUNO_UPSTREAM_SYNC_TOKEN secret (a fine-grained
      # token with contents and pull-requests write on this repository) to get a
      # fully automatic gate; without it the candidate PR still opens, and the
      # summary explains how to start the gate by hand.
      - name: Push exact candidate branch
        if: steps.candidate.outputs.outcome == 'candidate'
        env:
          GH_TOKEN: ${{ secrets.ZUNO_UPSTREAM_SYNC_TOKEN || github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          HEAD_BRANCH: ${{ steps.plan.outputs.branch }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          credential_file="${RUNNER_TEMP}/zuno-upstream-git-credential"
          trap 'rm -f "${credential_file}"' EXIT
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$credential_file"
          chmod 600 "$credential_file"
          lease=("--force-with-lease=refs/heads/${HEAD_BRANCH}:")
          if [[ -n "${REMOTE_SHA}" ]]; then
            lease=("--force-with-lease=refs/heads/${HEAD_BRANCH}:${REMOTE_SHA}")
          fi
          git -C "$CANDIDATE" \
            -c credential.helper= \
            -c credential.helper="store --file=${credential_file}" \
            push "${lease[@]}" -u origin "HEAD:refs/heads/${HEAD_BRANCH}"

      - name: Open or refresh review PR
        if: steps.candidate.outputs.outcome == 'candidate'
        env:
          GH_TOKEN: ${{ secrets.ZUNO_UPSTREAM_SYNC_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.ZUNO_UPSTREAM_SYNC_TOKEN == '' }}
          HEAD_BRANCH: ${{ steps.plan.outputs.branch }}
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
          TARGET_VERSION: ${{ steps.plan.outputs.target_version }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          UPSTREAM_COMMIT: ${{ steps.candidate.outputs.upstream_commit }}
          PLAN_PATH: ${{ steps.plan.outputs.plan_path }}
          REPORT: ${{ steps.candidate.outputs.report }}
          EXISTING_PR: ${{ steps.state.outputs.pr_number }}
          CONFLICT_ISSUE: ${{ steps.state.outputs.issue_number }}
        run: |
          set -euo pipefail
          overlap="$(python3 - <<'PY'
          import json
          import os
          plan = json.load(open(os.environ["PLAN_PATH"]))
          paths = plan["overlapping_files"]
          print(f'Upstream changed {plan["upstream_changed_files"]} files; the Zuno delta touches {plan["zuno_changed_files"]} files.')
          print()
          if not paths:
              print("No path overlap was detected by the pre-replay comparison.")
          else:
              print(f"{len(paths)} paths are modified on both sides (merged cleanly with the Codex baseline as merge base, or resolved by the rebrand replay below):")
              print("\n".join(f"- `{path}`" for path in paths))
          only = plan["baseline_only_commits"]
          if only:
              print()
              print(f"{len(only)} commits exist only on the previous Codex release branch and are not part of the new tag:")
              print("\n".join(f"- `{entry}`" for entry in only))
          PY
          )"
          replay="$(python3 scripts/zuno_upstream.py describe-rebrand --report "${REPORT}")"
          body="$(cat <<EOF
          This candidate merges exact Codex release \`${TARGET_TAG}\` (\`${UPSTREAM_COMMIT}\`) into the reviewed Zuno source \`main@${SOURCE_SHA}\`. The head commit's first parent is that \`main\` commit and its second parent is the release commit, so the diff below is exactly the upstream change plus regenerated derived artifacts.

          It was prepared in an isolated CI worktree by the scheduled upstream watcher, which force-updates this branch whenever \`main\` moves so the candidate always builds on the current reviewed source. Merging is the review gate: manual, or queued for GitHub auto-merge behind \`zuno/pr-gate\` when \`UPSTREAM_CODEX.toml\` sets \`[sync].automatic_merge = true\` and this replay needed no manual resolution.

          ${overlap}

          ${replay}

          ## Release flow

          1. \`zuno/pr-gate\` builds, smokes, attests, and seals the six platform packages for the exact head SHA.
          2. Review the upstream changes and any semantic drift in the overlapping paths.
          3. Merge with **Create a merge commit** (squash and rebase are rejected by promotion).
          4. \`zuno-release.yml\` then promotes the sealed bytes of this PR head to \`zuno-v${TARGET_VERSION}\` without rebuilding.

          Zuno-Source-Commit: ${SOURCE_SHA}
          Zuno-Upstream-Tag: ${TARGET_TAG}
          Zuno-Upstream-Commit: ${UPSTREAM_COMMIT}
          EOF
          )"
          if [[ -n "${EXISTING_PR}" ]]; then
            gh pr edit "${EXISTING_PR}" --body "${body}" --add-label "${CANDIDATE_LABEL}"
            gh pr comment "${EXISTING_PR}" --body "Refreshed the candidate: replayed main@\`${SOURCE_SHA}\` onto \`${TARGET_TAG}\`."
            pr_url="$(gh pr view "${EXISTING_PR}" --json url --jq .url)"
          else
            pr_url="$(gh pr create \
              --base main \
              --head "${HEAD_BRANCH}" \
              --label "${CANDIDATE_LABEL}" \
              --title "chore(upstream): sync Codex ${TARGET_VERSION}" \
              --body "${body}")"
          fi
          echo "Candidate PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${USING_DEFAULT_TOKEN}" == true ]]; then
            {
              echo
              echo "> The candidate was pushed with the default GITHUB_TOKEN, which cannot start \`pull_request\` workflows."
              echo "> Start the PR gate by closing and reopening the PR, or configure the \`ZUNO_UPSTREAM_SYNC_TOKEN\` secret for a fully automatic gate."
            } >> "${GITHUB_STEP_SUMMARY}"
            gh pr comment "${pr_url}" --body "This candidate was pushed with the default GITHUB_TOKEN, so \`zuno/pr-gate\` did not start automatically. Close and reopen the PR to run it, or configure the \`ZUNO_UPSTREAM_SYNC_TOKEN\` repository secret so future candidates gate on their own."
          fi

          # A clean replay supersedes any open conflict report for this release.
          if [[ -n "${CONFLICT_ISSUE}" ]]; then
            gh issue close "${CONFLICT_ISSUE}" --comment "Superseded: main@\`${SOURCE_SHA}\` now replays cleanly onto \`${TARGET_TAG}\` in ${pr_url}."
          fi

          # Close superseded candidates and conflict reports for OLDER releases
          # (a candidate for a newer release is never superseded by this one).
          gh pr list --state open --label "${CANDIDATE_LABEL}" --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("upstream-sync/")) | select(.headRefName != env.HEAD_BRANCH) | "\(.number) \(.headRefName)"' \
            | while read -r stale branch; do
                [[ -n "${stale}" ]] || continue
                python3 - "${branch#upstream-sync/}" "${TARGET_VERSION}" <<'PY' || continue
          import sys
          def key(v): return tuple(int(part) for part in v.split("."))
          sys.exit(0 if key(sys.argv[1]) < key(sys.argv[2]) else 1)
          PY
                gh pr close "${stale}" --comment "Superseded by ${pr_url} (Codex ${TARGET_TAG} is now being synced)."
                # Remove the branch too: an unmerged upstream-sync/* branch on
                # origin would otherwise keep counting as an open candidate.
                gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}" >/dev/null || true
              done
          gh issue list --state open --label "${CONFLICT_LABEL}" --json number,title \
            --jq '.[] | select(.title | contains(env.TARGET_TAG) | not) | "\(.number) \(.title)"' \
            | while read -r stale title; do
                [[ -n "${stale}" ]] || continue
                version="$(sed -n 's/.*rust-v\([0-9][0-9.]*[0-9]\).*/\1/p' <<<"${title}")"
                [[ -n "${version}" ]] || continue
                python3 - "${version}" "${TARGET_VERSION}" <<'PY' || continue
          import sys
          def key(v): return tuple(int(part) for part in v.split("."))
          sys.exit(0 if key(sys.argv[1]) < key(sys.argv[2]) else 1)
          PY
                gh issue close "${stale}" --comment "Superseded: Codex ${TARGET_TAG} is now being synced; its candidate is ${pr_url}."
              done

          # Hands-off merge: with `[sync].automatic_merge = true` in
          # UPSTREAM_CODEX.toml a candidate whose replay was fully automatic
          # (rebrand replay only; nothing copied from a hand-resolved candidate)
          # is queued for GitHub auto-merge, so it merges (as a merge commit)
          # the moment zuno/pr-gate passes and promotion follows. The repository
          # must allow auto-merge and its main ruleset must not require a human
          # review for this to complete.
          automatic_merge="$(python3 -c 'import tomllib; print(str(tomllib.load(open("UPSTREAM_CODEX.toml", "rb")).get("sync", {}).get("automatic_merge", False)).lower())')"
          reused="$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1])).get("rebrand", {}).get("reused", [])))' "${REPORT}")"
          if [[ "${automatic_merge}" == true && "${reused}" != 0 ]]; then
            echo "Auto-merge not queued: ${reused} path(s) were carried over from a hand-resolved candidate, so this replay was not fully automatic." >> "${GITHUB_STEP_SUMMARY}"
            gh pr comment "${pr_url}" --body "Auto-merge was not queued: ${reused} path(s) were carried over from a hand-resolved candidate (see the rebrand replay above), so this candidate waits for a manual merge."
          elif [[ "${automatic_merge}" == true ]]; then
            if gh pr merge "${pr_url}" --auto --merge; then
              echo "Auto-merge queued: the candidate merges when zuno/pr-gate passes." >> "${GITHUB_STEP_SUMMARY}"
              gh pr comment "${pr_url}" --body "Auto-merge is queued (\`[sync].automatic_merge = true\`): this candidate merges with a merge commit as soon as \`zuno/pr-gate\` passes, and \`zuno-release.yml\` then promotes it."
            else
              echo "Auto-merge could not be queued; the candidate waits for a manual merge." >> "${GITHUB_STEP_SUMMARY}"
              gh pr comment "${pr_url}" --body "\`[sync].automatic_merge = true\` but GitHub refused to queue auto-merge. Enable **Allow auto-merge** in the repository settings and make sure the \`main\` ruleset does not require a human review; until then merge this candidate by hand."
            fi
          fi

      - name: Report replay conflicts
        if: steps.candidate.outputs.outcome == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
          TARGET_VERSION: ${{ steps.plan.outputs.target_version }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          REPORT: ${{ steps.candidate.outputs.report }}
          EXISTING_ISSUE: ${{ steps.state.outputs.issue_number }}
        run: |
          set -euo pipefail
          files="$(python3 - <<'PY'
          import json
          import os
          paths = json.load(open(os.environ["REPORT"]))["conflicting_files"]
          print("\n".join(f"- `{path}`" for path in paths))
          PY
          )"
          count="$(python3 - <<'PY'
          import json
          import os
          print(len(json.load(open(os.environ["REPORT"]))["conflicting_files"]))
          PY
          )"
          replay="$(python3 scripts/zuno_upstream.py describe-rebrand --report "${REPORT}")"
          body="$(cat <<EOF
          Merging Codex \`${TARGET_TAG}\` into \`main@${SOURCE_SHA}\` leaves ${count} conflicting paths after the rebrand replay. The automation did not push anything; \`main\` is untouched.

          ${files}

          ${replay}

          ## Resolve locally

          \`\`\`sh
          git fetch --tags --prune upstream
          # If a finalized candidate for this release already exists on origin, add
          #   --reuse origin/upstream-sync/${TARGET_VERSION}
          # to copy its resolutions for every path main has not changed since.
          python3 scripts/zuno_upstream.py --no-fetch prepare \\
            --source main --target ${TARGET_TAG} \\
            --branch upstream-sync/${TARGET_VERSION} \\
            --worktree ../zuno-upstream-${TARGET_VERSION}
          # Run from the repository root. Only the paths listed above still carry
          # conflict markers (diff3 style, with the Codex baseline in the middle);
          # rename-only hunks were already replayed from FORK_REBRAND.toml. The new
          # baseline is already written to UPSTREAM_CODEX.toml. Fix the markers, then
          # regenerate derived artifacts:
          (cd ../zuno-upstream-${TARGET_VERSION}/codex-rs && cargo update --workspace \\
            && python3 app-server-protocol/scripts/write_schema_fixtures.py \\
            && python3 app-server-protocol/scripts/write_schema_fixtures.py --experimental \\
            && cargo run -p codex-config-schema --bin codex-write-config-schema)
          # Commit as a merge of the recorded main commit and the release. finalize refuses
          # leftover markers and refuses a source that differs from the one prepare recorded;
          # if main moved meanwhile, re-run prepare instead.
          python3 scripts/zuno_upstream.py finalize --worktree ../zuno-upstream-${TARGET_VERSION}
          git -C ../zuno-upstream-${TARGET_VERSION} push -u origin upstream-sync/${TARGET_VERSION}
          \`\`\`

          Open the PR from that branch (label \`upstream-sync\`). Once \`main\` changes, the watcher retries the merge and closes this issue if it becomes clean.

          Zuno-Source-Commit: ${SOURCE_SHA}
          Zuno-Upstream-Tag: ${TARGET_TAG}
          EOF
          )"
          if [[ -n "${EXISTING_ISSUE}" ]]; then
            gh issue edit "${EXISTING_ISSUE}" --body "${body}"
            gh issue comment "${EXISTING_ISSUE}" --body "Still conflicting when replaying main@\`${SOURCE_SHA}\` (${count} paths)."
            issue_url="$(gh issue view "${EXISTING_ISSUE}" --json url --jq .url)"
          else
            issue_url="$(gh issue create \
              --title "chore(upstream): Codex ${TARGET_TAG} candidate has replay conflicts" \
              --label "${CONFLICT_LABEL}" \
              --body "${body}")"
          fi
          {
            echo "## Replay conflicts for ${TARGET_TAG}"
            echo
            echo "${count} conflicting paths; tracked in ${issue_url}."
            echo
            echo "${files}"
            echo
            echo "${replay}"
          } >> "${GITHUB_STEP_SUMMARY}"
          # Conflict reports for older releases are superseded by this one.
          gh issue list --state open --label "${CONFLICT_LABEL}" --json number,title \
            --jq '.[] | select(.title | contains(env.TARGET_TAG) | not) | .number' \
            | while read -r stale; do
                [[ -n "${stale}" ]] || continue
                gh issue close "${stale}" --comment "Superseded by ${issue_url}: Codex ${TARGET_TAG} is now the newest stable release."
              done

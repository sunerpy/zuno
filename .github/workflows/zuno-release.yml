name: Promote Zuno candidate

# Promotes the exact bytes that `zuno-ci.yml` sealed for a merged PR head into a
# `zuno-vX.Y.Z` tag and GitHub release, without rebuilding. Runs automatically
# when an `upstream-sync/*` candidate PR is merged; every other release stays a
# manual dispatch with explicit run/artifact inputs.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: New preview tag, for example zuno-v0.154.0
        required: true
        type: string
      candidate_run_id:
        description: Exact successful Zuno CI run that owns zuno-candidate
        required: true
        type: string
      candidate_run_attempt:
        description: Exact attempt number of the successful Zuno CI run
        required: true
        type: string
      candidate_artifact_id:
        description: Exact immutable zuno-candidate artifact ID
        required: true
        type: string
      pull_request:
        description: Merged source-fork pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact certified PR head SHA
        required: true
        type: string

permissions:
  contents: write
  actions: read
  attestations: read
  pull-requests: read

concurrency:
  group: zuno-candidate-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact candidate bytes
    # Automatic promotion is limited to merged same-repository upstream-sync
    # candidates; anything else must be dispatched with explicit inputs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'upstream-sync/')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve promotion inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          INPUT_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request }}
          INPUT_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            release_tag="$INPUT_TAG"
            run_id="$INPUT_RUN_ID"
            run_attempt="$INPUT_RUN_ATTEMPT"
            artifact_id="$INPUT_ARTIFACT_ID"
            pr_number="$INPUT_PR_NUMBER"
            head_sha="$INPUT_HEAD_SHA"
          else
            # Merged upstream-sync candidate: derive every input from the PR head
            # and the successful Zuno CI run that sealed it.
            pr_number="$EVENT_PR_NUMBER"
            head_sha="$EVENT_HEAD_SHA"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$head_sha"
            version="$(git show "${head_sha}:codex-rs/Cargo.toml" | awk -F\" '/^version = /{print $2; exit}')"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "candidate head $head_sha has no release version in codex-rs/Cargo.toml" >&2
              exit 1
            }
            release_tag="zuno-v${version}"
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/zuno-ci.yml/runs?event=pull_request&status=success&head_sha=${head_sha}&per_page=20")"
            run_id="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.id) | last | .id // empty' <<<"$runs")"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "no successful Zuno CI run sealed candidate head $head_sha" >&2
              exit 1
            }
            run_attempt="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .run_attempt' <<<"$runs")"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=zuno-candidate")"
            artifact_id="$(jq -r '[.artifacts[] | select(.name == "zuno-candidate" and .expired == false)] | sort_by(.id) | last | .id // empty' <<<"$artifacts")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "Zuno CI run $run_id has no live zuno-candidate artifact" >&2
              exit 1
            }
          fi
          {
            echo "RELEASE_TAG=${release_tag}"
            echo "CANDIDATE_RUN_ID=${run_id}"
            echo "CANDIDATE_RUN_ATTEMPT=${run_attempt}"
            echo "CANDIDATE_ARTIFACT_ID=${artifact_id}"
            echo "PR_NUMBER=${pr_number}"
            echo "EXPECTED_HEAD_SHA=${head_sha}"
          } >> "$GITHUB_ENV"
          {
            echo "## Promotion inputs"
            echo
            echo "- tag: \`${release_tag}\`"
            echo "- pull request: #${pr_number} head \`${head_sha}\`"
            echo "- Zuno CI run: ${run_id} attempt ${run_attempt}, artifact ${artifact_id}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate merged source and exact candidate run
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^zuno-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.merged' <<<"$pr")" == true ]]
          [[ "$(jq -r '.base.ref' <<<"$pr")" == main ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.head.sha' <<<"$pr")" == "$EXPECTED_HEAD_SHA" ]]
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          merge_sha="$(jq -r '.merge_commit_sha' <<<"$pr")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin "$merge_sha"
          git merge-base --is-ancestor "$merge_sha" origin/main
          git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" "$merge_sha" || {
            echo "merge $merge_sha does not retain certified PR head $EXPECTED_HEAD_SHA; squash and rebase merges are forbidden" >&2
            exit 1
          }
          read -r -a merge_parents <<<"$(git show -s --format=%P "$merge_sha")"
          [[ "${#merge_parents[@]}" -eq 2 ]] || {
            echo "release merge $merge_sha must have exactly two parents" >&2
            exit 1
          }
          [[ "${merge_parents[0]}" == "$base_sha" ]] || {
            echo "release merge first parent ${merge_parents[0]} differs from PR base $base_sha" >&2
            exit 1
          }
          [[ "${merge_parents[1]}" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "release merge second parent ${merge_parents[1]} differs from certified PR head $EXPECTED_HEAD_SHA" >&2
            exit 1
          }
          read -r -a head_parents <<<"$(git show -s --format=%P "$EXPECTED_HEAD_SHA")"
          head_tree="$(git rev-parse "${EXPECTED_HEAD_SHA}^{tree}")"
          case "${#head_parents[@]}" in
            1)
              # Ordinary candidate (for example an upstream-sync replay): a linear
              # commit whose ancestry must still contain the recorded Codex baseline.
              zuno_ancestor="$EXPECTED_HEAD_SHA"
              ;;
            2)
              # Source-history bridge used by the original cutover: the merge of the
              # PR base and the reviewed Zuno tree, with the Zuno tree unchanged.
              [[ "${head_parents[0]}" == "$base_sha" ]] || {
                echo "bridge first parent ${head_parents[0]} differs from PR base $base_sha" >&2
                exit 1
              }
              zuno_tree="$(git rev-parse "${head_parents[1]}^{tree}")"
              [[ "$head_tree" == "$zuno_tree" ]] || {
                echo "bridge tree $head_tree differs from reviewed Zuno tree $zuno_tree" >&2
                exit 1
              }
              zuno_ancestor="${head_parents[1]}"
              ;;
            *)
              echo "certified PR head must have one parent or be a two-parent source-history bridge" >&2
              exit 1
              ;;
          esac
          baseline_commit="$(git show "${EXPECTED_HEAD_SHA}:UPSTREAM_CODEX.toml" | awk '
            /^\[baseline\]$/ { in_baseline=1; next }
            /^\[/ { in_baseline=0 }
            in_baseline && /^release_commit = / {
              value=$0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ')"
          [[ "$baseline_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$baseline_commit" "$zuno_ancestor" || {
            echo "certified head $zuno_ancestor does not retain Codex baseline $baseline_commit" >&2
            exit 1
          }
          merge_tree="$(git rev-parse "${merge_sha}^{tree}")"
          [[ "$merge_tree" == "$head_tree" ]] || {
            echo "merged tree $merge_tree differs from certified PR tree $head_tree" >&2
            exit 1
          }

          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          [[ "$(jq -r '.conclusion' <<<"$run")" == success ]]
          [[ "$(jq -r '.event' <<<"$run")" == pull_request ]]
          [[ "$(jq -r '.path' <<<"$run")" == '.github/workflows/zuno-ci.yml' ]]
          [[ "$(jq -r '.head_sha' <<<"$run")" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$(jq -r '.run_attempt' <<<"$run")" == "$CANDIDATE_RUN_ATTEMPT" ]]
          # The Actions run API may return an empty pull_requests array after
          # merge. PR identity is bound independently by the PR head check above
          # and the sealed manifest check below; do not depend on this advisory field.
          {
            echo "merge_sha=$merge_sha"
            echo "tree_sha=$merge_tree"
            echo "head_parents=${head_parents[*]}"
          } >> "$GITHUB_OUTPUT"
      - name: Download exact sealed candidate artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")"
          [[ "$(jq -r '.name' <<<"$artifact")" == zuno-candidate ]]
          [[ "$(jq -r '.expired' <<<"$artifact")" == false ]]
          [[ "$(jq -r '.workflow_run.id' <<<"$artifact")" == "$CANDIDATE_RUN_ID" ]]
          [[ "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" == "$EXPECTED_HEAD_SHA" ]]
          artifact_digest="$(jq -r '.digest // empty' <<<"$artifact")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "candidate artifact has no supported SHA-256 identity" >&2
            exit 1
          }
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            > candidate-artifact.zip
          actual_digest="sha256:$(sha256sum candidate-artifact.zip | awk '{print $1}')"
          [[ "$actual_digest" == "$artifact_digest" ]] || {
            echo "candidate artifact digest mismatch: expected $artifact_digest, got $actual_digest" >&2
            exit 1
          }
          mkdir downloaded
          unzip -q candidate-artifact.zip -d downloaded
          echo "digest=$artifact_digest" >> "$GITHUB_OUTPUT"
      - name: Verify candidate identity and every byte
        id: candidate
        shell: bash
        env:
          MERGE_TREE: ${{ steps.identity.outputs.tree_sha }}
          EXPECTED_HEAD_PARENTS: ${{ steps.identity.outputs.head_parents }}
        run: |
          set -euo pipefail
          manifest="$(find downloaded -type f -name candidate-manifest.json -print -quit)"
          test -n "$manifest"
          root="$(dirname "$manifest")"
          python3 - "$manifest" "$root" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          manifest_path, root = Path(sys.argv[1]), Path(sys.argv[2])
          data = json.loads(manifest_path.read_text())
          assert data["schemaVersion"] == 1
          assert data["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["workflow"] == ".github/workflows/zuno-ci.yml"
          assert data["runId"] == int(os.environ["CANDIDATE_RUN_ID"])
          assert data["runAttempt"] == int(os.environ["CANDIDATE_RUN_ATTEMPT"])
          assert data["pullRequest"] == int(os.environ["PR_NUMBER"])
          assert data["headRepository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["headSha"] == os.environ["EXPECTED_HEAD_SHA"]
          assert data["headParents"] == os.environ["EXPECTED_HEAD_PARENTS"].split()
          assert data["treeSha"] == os.environ["MERGE_TREE"]
          assert os.environ["RELEASE_TAG"] == f'zuno-v{data["version"]}'
          for entry in data["files"]:
              path = root / entry["name"]
              raw = path.read_bytes()
              assert len(raw) == entry["size"], entry["name"]
              assert hashlib.sha256(raw).hexdigest() == entry["sha256"], entry["name"]
          assert data["targets"] == [
              "aarch64-apple-darwin",
              "aarch64-pc-windows-msvc",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
          ]
          PY
          (cd "$root" && sha256sum --check zuno-package_SHA256SUMS)
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Verify candidate provenance attestations
        shell: bash
        env:
          ROOT: ${{ steps.candidate.outputs.root }}
        run: |
          set -euo pipefail
          signer_workflow="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/.github/workflows/zuno-ci.yml"
          gh attestation verify "$ROOT/candidate-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --deny-self-hosted-runners
          for archive in "$ROOT"/zuno-package-*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --deny-self-hosted-runners
          done
      - name: Create or validate immutable tag
        shell: bash
        env:
          MERGE_SHA: ${{ steps.identity.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$MERGE_SHA" ]]
          else
            git \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$MERGE_SHA" -m "Zuno ${RELEASE_TAG#zuno-v} preview"
            credential_file="${RUNNER_TEMP}/zuno-release-git-credential"
            trap 'rm -f "${credential_file}"' EXIT
            printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$credential_file"
            chmod 600 "$credential_file"
            git \
              -c credential.helper= \
              -c credential.helper="store --file=${credential_file}" \
              push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Create or update draft release
        shell: bash
        env:
          ROOT: ${{ steps.candidate.outputs.root }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/zuno-release.json 2>/dev/null; then
            [[ "$(jq -r '.isDraft' /tmp/zuno-release.json)" == true ]]
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
              --title "Zuno ${RELEASE_TAG#zuno-v} source-fork preview" \
              --notes "Zuno ${RELEASE_TAG#zuno-v} rebuilt from Codex rust-v${RELEASE_TAG#zuno-v} with the reviewed Zuno delta (PR #${PR_NUMBER}). Automatic update remains fail-closed; install manually after verifying zuno-package_SHA256SUMS."
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "$ROOT"/zuno-package-*.tar.gz \
            "$ROOT"/zuno-package_SHA256SUMS \
            "$ROOT"/smoke-*.json \
            "$ROOT"/candidate-manifest.json
      - name: Download draft assets and verify public bytes
        shell: bash
        env:
          ROOT: ${{ steps.candidate.outputs.root }}
        run: |
          set -euo pipefail
          mkdir release-download
          gh release download "$RELEASE_TAG" --dir release-download
          diff -u "$ROOT/zuno-package_SHA256SUMS" release-download/zuno-package_SHA256SUMS
          (cd release-download && sha256sum --check zuno-package_SHA256SUMS)
          python3 - "$ROOT" release-download <<'PY'
          from pathlib import Path
          import hashlib, sys
          left, right = Path(sys.argv[1]), Path(sys.argv[2])
          names = sorted(path.name for path in left.iterdir() if path.is_file())
          assert names == sorted(path.name for path in right.iterdir() if path.is_file())
          for name in names:
              assert hashlib.sha256((left / name).read_bytes()).digest() == hashlib.sha256((right / name).read_bytes()).digest(), name
          PY
      - name: Publish non-latest preview
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

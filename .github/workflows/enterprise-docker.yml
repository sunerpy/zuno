name: Enterprise rootless Docker contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Rootless Docker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      ZUNO_POSTGRES_BINDIR: /usr/lib/postgresql/16/bin
      ZUNO_ENTERPRISE_WEB_DIST: ${{ github.workspace }}/enterprise/web/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: enterprise-preview-docker
          key: ${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            enterprise/sdk/package-lock.json
            enterprise/web/package-lock.json
      - name: Prepare the actual Web bundle and native browser
        run: |
          npm --prefix enterprise/sdk ci --ignore-scripts --no-audit --no-fund
          npm --prefix enterprise/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix enterprise/web run build
          cd enterprise/web
          npx playwright install --with-deps chromium
      - name: Ensure rootless prerequisites
        run: |
          set -euo pipefail
          if [ ! -x "$ZUNO_POSTGRES_BINDIR/postgres" ]; then
            sudo apt-get update
            sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          fi
          if ! command -v newuidmap || ! command -v newgidmap; then
            sudo apt-get update
            sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends uidmap
          fi
          if ! command -v dockerd-rootless.sh; then
            sudo install -m 0755 -d /etc/apt/keyrings
            curl --fail --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/docker.asc"
            fingerprint="$(gpg --show-keys --with-colons "$RUNNER_TEMP/docker.asc" | awk -F: '$1 == "fpr" { print $10; exit }')"
            test "$fingerprint" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
            sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/zuno-docker.asc
            arch="$(dpkg --print-architecture)"
            printf 'deb [arch=%s signed-by=/etc/apt/keyrings/zuno-docker.asc] https://download.docker.com/linux/ubuntu noble stable\n' "$arch" \
              | sudo tee /etc/apt/sources.list.d/zuno-docker.list > /dev/null
            sudo apt-get update
            sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends docker-ce-rootless-extras
          fi
          runtime="/run/user/$(id -u)"
          if [ ! -S "$runtime/bus" ]; then
            sudo loginctl enable-linger "$(id -un)"
            sudo systemctl start "user@$(id -u).service"
          fi
          test -S "$runtime/bus"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          docker --version
      - name: Verify isolated gateway and native recovery
        run: python3 scripts/check_enterprise_docker.py

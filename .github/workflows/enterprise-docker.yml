name: Enterprise rootless Docker contracts

on:
  workflow_call:
    inputs:
      include-experimental-web:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      include-experimental-web:
        description: Run the deferred experimental Web fixture
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    name: Rootless Docker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      ZUNO_POSTGRES_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: enterprise-preview-docker
          key: ${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.include-experimental-web
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            enterprise/sdk/package-lock.json
            enterprise/web/package-lock.json
      - name: Prepare the actual Web bundle and native browser
        if: inputs.include-experimental-web
        run: |
          npm --prefix enterprise/sdk ci --ignore-scripts --no-audit --no-fund
          npm --prefix enterprise/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix enterprise/web run build
          cd enterprise/web
          npx playwright install --with-deps chromium
          echo "ZUNO_ENTERPRISE_WEB_DIST=$GITHUB_WORKSPACE/enterprise/web/dist" >> "$GITHUB_ENV"
      - name: Ensure rootless prerequisites
        uses: ./.github/actions/enterprise-rootless
      - name: Verify isolated gateway and native recovery
        run: python3 scripts/check_enterprise_docker.py
      - name: Verify the packaged native binary
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          version="$(target/debug/zuno-enterprise --version)"
          version="${version#zuno-enterprise }"
          mkdir -p target/enterprise-artifact
          archive="target/enterprise-artifact/zuno-enterprise-${version}-${target}.tar.gz"
          tar --format=gnu -czf "$archive" -C target/debug zuno-enterprise
          python3 scripts/enterprise_artifact_smoke.py \
            --archive "$archive" --target "$target" --version "$version" \
            --source-sha "$GITHUB_SHA" --profile dev \
            --output "target/enterprise-artifact/${target}.smoke.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-native-smoke-${{ runner.arch }}
          path: target/enterprise-artifact/*.smoke.json
          if-no-files-found: error
          retention-days: 14

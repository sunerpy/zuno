# TEMPORARY probe. Deleted before this branch merges.
#
# Answers two questions that decide the release matrix, and that no amount of
# documentation reading can settle:
#
#   1. Does CodeBuild's GitHub Actions runner mode work at all on MAC_ARM and on
#      WINDOWS_SERVER_2022_CONTAINER? Every macOS/Windows CodeBuild project in
#      this account is CODEPIPELINE/S3/CODECOMMIT sourced, so runner mode on
#      those environment types has no local precedent.
#   2. Can each runner EXECUTE the target it would have to cross-build?
#      `release_surface.rs` requires every built target to be smoke-tested, so a
#      target that builds but cannot run is a target that cannot ship.
#
#      * macOS ARM -> x86_64-apple-darwin needs Rosetta 2.
#      * Windows x86_64 -> aarch64-pc-windows-msvc needs ARM64 emulation, which
#        Windows Server does not have.
name: Runner probe

on:
  push:
    branches:
      - task-r14

permissions:
  contents: read

jobs:
  probe-macos:
    name: Probe macOS ARM
    runs-on:
      - codebuild-zuno-runner-macos-${{ github.run_id }}-${{ github.run_attempt }}
      - zuno-probe-macos-usw2
    timeout-minutes: 30
    steps:
      - name: Describe the machine
        run: |
          set -x
          uname -a
          uname -m
          sw_vers || true
          sysctl -n hw.optional.arm64 || true
          xcodebuild -version || true
          echo "--- runner name ---"
          echo "RUNNER_NAME=${RUNNER_NAME:-unset}"

      - name: Is Rosetta 2 present
        id: rosetta
        continue-on-error: true
        run: |
          set -x
          ls -l /usr/libexec/rosetta 2>&1 || echo "no /usr/libexec/rosetta"
          pgrep -l oahd 2>&1 || echo "no oahd"
          arch -x86_64 /usr/bin/true && echo "ROSETTA_EXEC=yes" || echo "ROSETTA_EXEC=no"

      - name: Rust, then cross-build and try to RUN an x86_64 binary
        continue-on-error: true
        run: |
          set -x
          rustc -vV || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustc -vV
          rustup target add x86_64-apple-darwin
          printf 'fn main(){println!("ran on {}", std::env::consts::ARCH);}' > probe.rs
          rustc --target x86_64-apple-darwin -O probe.rs -o probe-x86
          file probe-x86
          ./probe-x86 && echo "X86_EXECUTION=yes" || echo "X86_EXECUTION=no"

  probe-windows:
    name: Probe Windows x86_64
    runs-on:
      - codebuild-zuno-runner-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - zuno-probe-windows
    timeout-minutes: 30
    steps:
      - name: Describe the machine
        shell: pwsh
        run: |
          $env:PROCESSOR_ARCHITECTURE
          [System.Environment]::Is64BitOperatingSystem
          Get-ComputerInfo -Property WindowsProductName, Osarchitecture | Format-List
          "RUNNER_NAME=$env:RUNNER_NAME"

      - name: Rust, then cross-build and try to RUN an aarch64 binary
        continue-on-error: true
        shell: pwsh
        run: |
          rustc -vV
          rustup target add aarch64-pc-windows-msvc
          'fn main(){println!("ran on {}", std::env::consts::ARCH);}' | Out-File -Encoding ascii probe.rs
          rustc --target aarch64-pc-windows-msvc -O probe.rs -o probe-arm.exe
          if (Test-Path probe-arm.exe) { "BUILD_ARM=yes" } else { "BUILD_ARM=no" }
          try { & .\probe-arm.exe; "ARM_EXECUTION=yes" } catch { "ARM_EXECUTION=no: $_" }

      - name: Native x86_64 build and run
        shell: pwsh
        run: |
          'fn main(){println!("ran on {}", std::env::consts::ARCH);}' | Out-File -Encoding ascii native.rs
          rustc -O native.rs -o native.exe
          & .\native.exe

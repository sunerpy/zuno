# Release controller and artifact promotion.
#
# Compilation lives exclusively in release-candidate.yml. This workflow either:
#   1. asks release-please to open/update a release PR and dispatches its exact
#      head to the candidate workflow, or
#   2. after that certified PR is merged, asks release-please to create the tag
#      and draft release, verifies the retained candidate by immutable run ID,
#      and promotes those exact bytes.
#
# GITHUB_TOKEN-created pushes do not start another workflow. The candidate merge
# job therefore dispatches this workflow explicitly after merging the release PR.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "orchestrate runs release-please; promote publishes an existing draft/tag"
        required: true
        default: orchestrate
        type: choice
        options:
          - orchestrate
          - promote
      candidate_run_id:
        description: "Exact successful release-candidate workflow run"
        required: false
        type: string
      release_pr_number:
        description: "Release PR certified by the candidate run"
        required: false
        type: string
      candidate_head_sha:
        description: "Exact source SHA used by the candidate run"
        required: false
        type: string
      release_tag:
        description: "Existing draft/tag used only by promote recovery mode"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-controller
  cancel-in-progress: false

jobs:
  release_please:
    name: Release Please
    if: github.event_name == 'push' || inputs.mode == 'orchestrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch_candidate:
    name: Dispatch release candidate
    needs: release_please
    if: |
      !cancelled()
      && needs.release_please.result == 'success'
      && needs.release_please.outputs.release_created != 'true'
      && vars.RELEASE_CANDIDATE_AUTOMATION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the one open release PR
        id: release_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_PR: ${{ needs.release_please.outputs.pr }}
          EXPECTED_BASE_SHA: ${{ github.sha }}
          RELEASE_PR_REFRESH_ENABLED: "1"
        run: |
          set -euo pipefail
          if [ -n "${ACTION_PR:-}" ] && jq -e 'type == "object" and .number != null' <<<"$ACTION_PR" >/dev/null; then
            number=$(jq -r '.number' <<<"$ACTION_PR")
          else
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")
            mapfile -t numbers < <(
              jq -r '
                .[]
                | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
                | select(.head.ref | startswith("release-please--branches--main--"))
                | select([.labels[].name] | index("autorelease: pending") != null)
                | .number
              ' <<<"$prs"
            )
            if [ "${#numbers[@]}" -eq 0 ]; then
              echo "::notice title=Release controller::no release PR requires a candidate"
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${#numbers[@]}" -gt 1 ]; then
              echo "::error title=Release controller::expected at most one open release PR, found ${#numbers[@]}"
              exit 1
            fi
            number=${numbers[0]}
          fi

          resolved=$(
            RELEASE_PR_NUMBER="$number" \
              .github/scripts/resolve-release-pr-head.sh
          )
          head_sha=$(jq -r '.head_sha' <<<"$resolved")
          head_ref=$(jq -r '.head_ref' <<<"$resolved")
          refreshed=$(jq -r '.refreshed' <<<"$resolved")
          previous_base_sha=$(jq -r '.previous_base_sha // ""' <<<"$resolved")
          previous_head_sha=$(jq -r '.previous_head_sha // ""' <<<"$resolved")
          {
            echo "dispatch=true"
            echo "number=${number}"
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
            echo "refreshed=${refreshed}"
            echo "previous_base_sha=${previous_base_sha}"
            echo "previous_head_sha=${previous_head_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch exact candidate ref
        if: steps.release_pr.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
          HEAD_SHA: ${{ steps.release_pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.release_pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_REF" \
            -f release_pr_number="$PR_NUMBER" \
            -f expected_head_sha="$HEAD_SHA" \
            -f mode=automatic

      - name: Record required manual approval
        if: steps.release_pr.outputs.dispatch == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
          HEAD_SHA: ${{ steps.release_pr.outputs.head_sha }}
          REFRESHED: ${{ steps.release_pr.outputs.refreshed }}
          PREVIOUS_BASE_SHA: ${{ steps.release_pr.outputs.previous_base_sha }}
          PREVIOUS_HEAD_SHA: ${{ steps.release_pr.outputs.previous_head_sha }}
        run: |
          set -euo pipefail
          {
            echo "### Manual release approval required"
            echo
            if [ "$REFRESHED" = true ]; then
              echo "The existing release PR was safely refreshed after a non-releasable main update:"
              echo
              echo "- previous base: \`${PREVIOUS_BASE_SHA}\`"
              echo "- previous head: \`${PREVIOUS_HEAD_SHA}\`"
              echo "- certified head: \`${HEAD_SHA}\`"
              echo
            fi
            echo "Release PR #${PR_NUMBER} was created by \`GITHUB_TOKEN\` at \`${HEAD_SHA}\`."
            echo "If GitHub marks its ordinary CI run as \`action_required\`, approve that exact run."
            echo
            echo "1. Review the PR and confirm the exact head SHA above."
            echo "2. Approve its **CI** Actions run when GitHub requests approval."
            echo "3. Wait for the independently dispatched \`zuno/pr-gate\` candidate to succeed."
            echo "4. Revalidate the same head before manually merging."
            echo
            echo "Do not replace this approval with a skip marker, \`pull_request_target\`, or a privileged bot token."
          } >> "$GITHUB_STEP_SUMMARY"

  resolve_release:
    name: Resolve release and candidate
    needs: release_please
    if: |
      !cancelled() && (
        (needs.release_please.result == 'success' && needs.release_please.outputs.release_created == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'promote')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      # GitHub hides draft releases from read-only tokens as "not found".
      # This job must inspect the exact draft before the publish job can run.
      contents: write
      pull-requests: read
      statuses: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
      tree_sha: ${{ steps.identity.outputs.tree_sha }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      candidate_run_attempt: ${{ steps.candidate.outputs.run_attempt }}
      release_pr_number: ${{ steps.candidate.outputs.pr_number }}
      candidate_head_sha: ${{ steps.candidate.outputs.head_sha }}
      release_pr_head_sha: ${{ steps.candidate.outputs.pr_head_sha }}
    steps:
      - name: Resolve tag and release identity
        id: release_input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release_please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release_please.outputs.sha }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CREATED" = true ]; then
            tag=$RELEASE_TAG
            sha=$RELEASE_SHA
          else
            tag=$RECOVERY_TAG
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error title=Release identity::promote mode requires a complete v* release_tag"
              exit 1
            fi
            ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")
            object_type=$(jq -r '.object.type' <<<"$ref")
            sha=$(jq -r '.object.sha' <<<"$ref")
            while [ "$object_type" = tag ]; do
              annotated=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}")
              object_type=$(jq -r '.object.type' <<<"$annotated")
              sha=$(jq -r '.object.sha' <<<"$annotated")
            done
            if [ "$object_type" != commit ]; then
              echo "::error title=Release identity::${tag} does not peel to a commit"
              exit 1
            fi
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Release identity::release-please returned an invalid tag or SHA"
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.release_input.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cross-check tag, manifest version, tree, and draft release
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_input.outputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ steps.release_input.outputs.sha }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          if [ "$release_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error title=Release identity::tag resolved to ${release_sha}, expected ${EXPECTED_RELEASE_SHA}"
            exit 1
          fi
          version=$(
            awk '
              /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )
          if [ "v${version}" != "$TAG" ]; then
            echo "::error title=Release identity::tag ${TAG} disagrees with Cargo.toml version ${version}"
            exit 1
          fi
          # The REST "release by tag" endpoint returns 404 for drafts. The
          # GitHub CLI resolves authenticated drafts through the releases list,
          # which is the same behavior used by the publication step below.
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)
          if [ "$(jq -r '.isDraft' <<<"$release")" != true ] || [ "$(jq -r '.tagName' <<<"$release")" != "$TAG" ]; then
            echo "::error title=Release identity::${TAG} is not the expected draft release"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "release_sha=${release_sha}"
            echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and validate exact candidate run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_PR_NUMBER: ${{ inputs.release_pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.candidate_head_sha }}
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
        run: |
          set -euo pipefail
          run_id=$INPUT_RUN_ID
          pr_number=$INPUT_PR_NUMBER
          head_sha=$INPUT_HEAD_SHA

          if [ -z "$pr_number" ] || [ -z "$head_sha" ]; then
            prs=$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")
            mapfile -t candidates < <(
              jq -r '
                .[]
                | select(.merged_at != null)
                | select(.base.ref == "main")
                | select(.head.ref | startswith("release-please--branches--main--"))
                | "\(.number)\t\(.head.sha)"
              ' <<<"$prs"
            )
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "::error title=Candidate resolution::expected one merged release PR for ${RELEASE_SHA}, found ${#candidates[@]}"
              exit 1
            fi
            pr_number=${candidates[0]%%$'\t'*}
            head_sha=${candidates[0]#*$'\t'}
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          pr_head_sha=$(jq -r '.head.sha' <<<"$pr")
          if [ "$(jq -r '.merged' <<<"$pr")" != true ] \
            || [ "$(jq -r '.base.ref' <<<"$pr")" != main ] \
            || [ "$(jq -r '.head.repo.full_name' <<<"$pr")" != "$GITHUB_REPOSITORY" ] \
            || [[ "$(jq -r '.head.ref' <<<"$pr")" != release-please--branches--main--* ]] \
            || ! [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error title=Candidate resolution::release PR ${pr_number} is not the expected merged release-please PR"
            exit 1
          fi

          if [ -z "$run_id" ]; then
            status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status")
            target_url=$(
              jq -er '
                .statuses
                | map(select(.context == "zuno/pr-gate" and .state == "success"))
                | first
                | .target_url
              ' <<<"$status"
            )
            if [[ "$target_url" =~ /actions/runs/([0-9]+)$ ]]; then
              run_id=${BASH_REMATCH[1]}
            else
              echo "::error title=Candidate resolution::successful candidate status does not name an immutable run"
              exit 1
            fi
          fi

          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Candidate resolution::candidate identifiers are invalid"
            exit 1
          fi

          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          run_attempt=$(jq -r '.run_attempt' <<<"$run")
          if [ "$(jq -r '.path' <<<"$run")" != ".github/workflows/release-candidate.yml" ] \
            || [ "$(jq -r '.event' <<<"$run")" != workflow_dispatch ] \
            || [ "$(jq -r '.status' <<<"$run")" != completed ] \
            || [ "$(jq -r '.conclusion' <<<"$run")" != success ] \
            || [ "$(jq -r '.head_sha' <<<"$run")" != "$head_sha" ] \
            || ! [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          then
            echo "::error title=Candidate resolution::run ${run_id} is not the successful candidate for ${head_sha}"
            exit 1
          fi

          {
            echo "run_id=${run_id}"
            echo "run_attempt=${run_attempt}"
            echo "pr_number=${pr_number}"
            echo "head_sha=${head_sha}"
            echo "pr_head_sha=${pr_head_sha}"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Promote sealed candidate
    needs: [release_please, resolve_release]
    if: ${{ !cancelled() && needs.resolve_release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate by immutable workflow run ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate
          run-id: ${{ needs.resolve_release.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify manifest, source tree, targets, sizes, and checksums
        env:
          CANDIDATE_ROOT: candidate
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ needs.resolve_release.outputs.candidate_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.resolve_release.outputs.candidate_run_attempt }}
          EXPECTED_PR_NUMBER: ${{ needs.resolve_release.outputs.release_pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve_release.outputs.candidate_head_sha }}
          EXPECTED_PR_HEAD_SHA: ${{ needs.resolve_release.outputs.release_pr_head_sha }}
          EXPECTED_TREE_SHA: ${{ needs.resolve_release.outputs.tree_sha }}
          EXPECTED_VERSION: ${{ needs.resolve_release.outputs.version }}
          EXPECTED_TAG: ${{ needs.resolve_release.outputs.tag }}
        run: .github/scripts/verify-release-candidate.sh

      - name: Verify GitHub provenance attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve_release.outputs.candidate_head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(candidate/*.tar.gz candidate/*.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "::error title=Provenance::expected six archives, found ${#archives[@]}"
            exit 1
          fi
          signer="github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml"
          for archive in "${archives[@]}"; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --signer-digest "$SOURCE_SHA" \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners
          done

      - name: Upload assets while the release remains draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            candidate/*.tar.gz \
            candidate/*.zip \
            candidate/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_release.outputs.tag }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets)
          if [ "$(jq -r '.isDraft' <<<"$release")" != true ] || [ "$(jq -r '.tagName' <<<"$release")" != "$TAG" ]; then
            echo "::error title=Publication::release stopped being the expected draft before publication"
            exit 1
          fi
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)
          mapfile -t expected < <(
            {
              find candidate -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n'
              find candidate -maxdepth 1 -type f -name '*.zip' -printf '%f\n'
              printf '%s\n' SHA256SUMS
            } | LC_ALL=C sort
          )
          if ! diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "::error title=Publication::draft asset set is incomplete or contains unexpected files"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

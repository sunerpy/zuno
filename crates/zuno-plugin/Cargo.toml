[package]
name = "zuno-plugin"
description = "Plugin host: the hook bus and the plugin lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
wasm = ["dep:wasmtime"]

[[bin]]
name = "zuno-example-plugin"
path = "../../examples/rust_plugin.rs"

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
zuno-auth = { workspace = true }
zuno-config = { workspace = true }
zuno-db = { workspace = true }
zuno-engine = { workspace = true }
zuno-error = { workspace = true }
zuno-llm = { workspace = true }
zuno-paths = { workspace = true }
zuno-permission = { workspace = true }
zuno-plugin-sdk = { workspace = true }
zuno-process = { workspace = true }
zuno-tool = { workspace = true }
zuno-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
zuno-testkit = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[package]
name = "zuno-goal"
description = "Goal store and continuation board that survive across sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
# `zuno-db` supplies the connection, the pragmas and the `IMMEDIATE` transaction
# helper. It is a dependency and *not* a host: the goal lives in its own database
# file so that adding it cannot perturb `zuno-db`'s byte-compatible 19-table
# `opencode.db` schema. See `store.rs`.
zuno-db = { workspace = true }
zuno-engine = { workspace = true }
zuno-error = { workspace = true }
zuno-llm = { workspace = true }
zuno-paths = { workspace = true }
zuno-tool = { workspace = true }
# The Markdown projection is watched, not watching: it consumes `zuno-watch`'s own
# `FileEvent` so there is exactly one file watcher in the workspace, in the crate
# that owns watching. See `projection.rs` for why no `Watcher` is built here.
zuno-watch = { workspace = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# A spilled objective is addressed by a v4 UUID directory, which is also what
# makes the pointer sentence unforgeable: a path whose parent is not a UUID is
# rejected rather than read. Ports `codex-rs/tui/src/goal_files.rs:171`.
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

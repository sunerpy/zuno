[package]
name = "zuno-db"
description = "Zuno-native SQLite sessions, events, inboxes, jobs, and migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
zuno-attachment = { workspace = true }
zuno-error = { workspace = true }
zuno-orchestration = { workspace = true }
zuno-paths = { workspace = true }
zuno-snapshot = { workspace = true }
zuno-tool = { workspace = true }
zuno-types = { workspace = true }
# `trace` is carried for one reason: the hydration test proves its statement
# count with SQLite's own `SQLITE_TRACE_STMT` hook, not only with the counter
# this crate keeps. A self-reported number is not evidence of an absent N+1.
rusqlite = { workspace = true, features = ["trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The three differentials here run the installed release directly. `zuno-testkit`
# resolves and screens it, so no test in this crate names a package-manager path.
# This edge is a cycle only through dev-dependencies (`zuno-testkit`'s own dev-deps
# name `zuno-db`), which cargo permits and which cannot affect either lib build.
zuno-testkit = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

# `vacuum::SystemDiskSpace` needs one `statvfs` call to answer "is there room to
# rewrite this whole file". `rustix` is the cheapest correct way to get it:
#
# * it is **already in `Cargo.lock` at this exact version** (`tempfile` pulls it
#   with the same `fs` feature), so naming it adds a dependency edge and zero
#   packages;
# * the syscall's `unsafe` stays inside the dependency, so `zuno-db` keeps this
#   workspace's `unsafe_code = "forbid"`. A hand-rolled `libc::statvfs` or a
#   `windows-sys` `GetDiskFreeSpaceExW` cannot satisfy that lint at all;
# * it needs no subprocess. The alternative without a dependency is spawning
#   `df -Pk` and parsing its table, which fails on a stripped `PATH` — something
#   `zuno-cli`'s differential suite explicitly tests the `db` command against.
#
# Target-gated because rustix's `fs` module is unix-only; elsewhere
# `vacuum::Availability::Unknown` records that the guard could not be evaluated.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true

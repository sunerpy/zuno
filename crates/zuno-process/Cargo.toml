[package]
name = "zuno-process"
description = "Safe OS-level containment for long-lived child process trees."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `shutdown_contained_child` is the one contained-shutdown dispatch every tokio-owned
# resident host (LSP, process extension, product agent, background shell) settles through,
# and `off_runtime_worker` is the one home for moving the blocking process-control call
# off a current-thread runtime. Both need the runtime's process, task and time drivers.
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "termios"] }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true }

[dev-dependencies]
portable-pty = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package]
name = "oc-db"
description = "SQLite storage layer with schema parity against the TypeScript `opencode.db`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
oc-error = { workspace = true }
oc-paths = { workspace = true }
oc-snapshot = { workspace = true }
oc-tool = { workspace = true }
# `trace` is carried for one reason: the hydration test proves its statement
# count with SQLite's own `SQLITE_TRACE_STMT` hook, not only with the counter
# this crate keeps. A self-reported number is not evidence of an absent N+1.
rusqlite = { workspace = true, features = ["trace"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

# `vacuum::SystemDiskSpace` needs one `statvfs` call to answer "is there room to
# rewrite this whole file". `rustix` is the cheapest correct way to get it:
#
# * it is **already in `Cargo.lock` at this exact version** (`tempfile` pulls it
#   with the same `fs` feature), so naming it adds a dependency edge and zero
#   packages;
# * the syscall's `unsafe` stays inside the dependency, so `oc-db` keeps this
#   workspace's `unsafe_code = "forbid"`. A hand-rolled `libc::statvfs` or a
#   `windows-sys` `GetDiskFreeSpaceExW` cannot satisfy that lint at all;
# * it needs no subprocess. The alternative without a dependency is spawning
#   `df -Pk` and parsing its table, which fails on a stripped `PATH` — something
#   `oc-cli`'s differential suite explicitly tests the `db` command against.
#
# Target-gated because rustix's `fs` module is unix-only; elsewhere
# `vacuum::Availability::Unknown` records that the guard could not be evaluated.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true

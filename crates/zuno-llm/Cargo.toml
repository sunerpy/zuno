[package]
name = "zuno-llm"
description = "Provider-agnostic model interface, provider registry, streaming event vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# ---------------------------------------------------------------------------
# `zuno-llm` MUST NOT depend on any `zuno-provider-*` crate.
#
# That edge is the one this crate exists to keep absent. `zuno-llm` is the spine
# every provider family implements against; if the spine also *named* the
# families, editing one wire protocol would recompile the spine and, through it,
# `zuno-engine`, `zuno-server`, `zuno-tui` and the CLI. The registry in `registry.rs`
# is how a provider reaches the spine instead: the composition root in `zuno-cli`
# owns both edges, so a provider edit rebuilds one leaf.
#
# `tests/registry_dependency_direction.rs` asserts the absence over the whole
# first-party transitive closure, so a later todo cannot re-add the edge — not
# even indirectly through a third crate.
#
# The technique, and the note explaining why an unused reverse edge is worth
# deleting rather than tolerating, is taken from
# `jcode`.
# ---------------------------------------------------------------------------
[dependencies]
zuno-auth = { workspace = true }
zuno-config = { workspace = true }
zuno-error = { workspace = true }
zuno-network = { workspace = true }
zuno-paths = { workspace = true }

futures = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zuno-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

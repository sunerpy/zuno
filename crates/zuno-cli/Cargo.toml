[package]
name = "zuno-cli"
description = "Command-line entry point and subcommand dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "zuno"
path = "src/main.rs"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
zuno-agent = { workspace = true }
zuno-auth = { workspace = true }
zuno-catalog = { workspace = true }
zuno-config = { workspace = true }
zuno-db = { workspace = true }
zuno-engine = { workspace = true }
zuno-error = { workspace = true }
zuno-extension = { workspace = true }
zuno-goal = { workspace = true }
zuno-harness = { workspace = true }
zuno-llm = { workspace = true }
zuno-memory = { workspace = true }
zuno-lsp = { workspace = true }
zuno-mcp = { workspace = true }
zuno-observability = { workspace = true }
zuno-paths = { workspace = true }
zuno-permission = { workspace = true }
zuno-process = { workspace = true }
zuno-provider-anthropic = { workspace = true }
zuno-provider-bedrock = { workspace = true }
zuno-provider-compatible = { workspace = true }
zuno-provider-google = { workspace = true }
zuno-provider-openai = { workspace = true }
zuno-runtime = { workspace = true }
zuno-search = { workspace = true }
zuno-server = { workspace = true }
zuno-snapshot = { workspace = true }
zuno-tool = { workspace = true }
zuno-tools = { workspace = true }
zuno-tui = { workspace = true }
zuno-watch = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
futures = { workspace = true }
portable-pty = { workspace = true }
zuno-testkit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
which = { workspace = true }

[lints]
workspace = true

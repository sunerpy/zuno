[package]
name = "zuno-server"
description = "HTTP server exposing the `/api` surface and the server-sent event stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
enterprise = [
    "dep:zuno-environment",
    "dep:zuno-identity",
    "dep:zuno-postgres",
    "dep:zuno-worker",
    "dep:sqlx-core",
    "dep:sqlx-postgres",
    "dep:tokio-util",
    "dep:reqwest",
    "dep:zuno-network",
]

[[test]]
name = "enterprise_state"
required-features = ["enterprise"]

[dependencies]
axum = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, optional = true }
zuno-network = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
zuno-attachment = { workspace = true }
zuno-auth = { workspace = true }
zuno-application = { workspace = true }
zuno-catalog = { workspace = true }
zuno-config = { workspace = true }
zuno-db = { workspace = true }
zuno-engine = { workspace = true }
zuno-environment = { workspace = true, optional = true }
zuno-error = { workspace = true }
zuno-goal = { workspace = true }
zuno-llm = { workspace = true }
zuno-memory = { workspace = true }
zuno-learning = { workspace = true }
zuno-identity = { workspace = true, optional = true }
zuno-observability = { workspace = true }
zuno-paths = { workspace = true }
zuno-permission = { workspace = true }
zuno-postgres = { workspace = true, optional = true }
zuno-pty = { workspace = true }
zuno-tool = { workspace = true }
zuno-types = { workspace = true }
zuno-worker = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "service"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
zuno-tool = { workspace = true }
zuno-orchestration = { workspace = true }
jsonschema = { version = "=0.37.1", default-features = false }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
zuno-session-control = { workspace = true }
zuno-tools = { workspace = true }

[lints]
workspace = true

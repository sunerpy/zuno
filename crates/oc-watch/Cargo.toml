[package]
name = "oc-watch"
description = "Filesystem watcher publishing coalesced, bounded change events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `notify` replaces the oracle's `@parcel/watcher` native binding
# (`filesystem/watcher.ts:26-36`), which is a per-platform `.node` addon loaded
# by `require()` at runtime. `notify` is pure Rust and compiles into the binary,
# so there is no `hasNativeBinding()` case to degrade into.
notify = { workspace = true }
# Gitignore semantics. Only the matcher half (`ignore::gitignore`) is used; the
# walker lives in `oc-search`. A watcher is told about a path and must decide,
# so it needs `Gitignore::matched_path_is_dir`, not `WalkBuilder`.
ignore = { workspace = true }
# The glob half of `Ignore.PATTERNS` (`filesystem/ignore.ts:34-46`) and every
# user pattern from `watcher.ignore`.
globset = { workspace = true }
# `tokio::sync::mpsc`'s bounded channel is the publish surface. `try_send` is
# the non-blocking primitive the whole overflow policy is built on, and it is
# callable off-runtime, which is why the flush loop can be a plain OS thread.
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# `WatcherConfig::ignore` — the `watcher.ignore` key.
oc-config = { workspace = true }
# `Env`, so flag reads are a pure function of an explicit map rather than a
# `std::env` call no test in this workspace is allowed to mutate.
oc-paths = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

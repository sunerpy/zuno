[package]
name = "zuno-pty"
description = "Pseudo-terminal management for interactive shell sessions with OS-level child containment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The pty itself. See the rationale on the pin in the workspace manifest: it is
# what makes `unsafe_code = "forbid"` satisfiable for this crate.
portable-pty = { workspace = true }
zuno-process = { workspace = true }
zuno-sandbox = { workspace = true }
# `tokio::sync::mpsc`'s bounded channel is the per-subscriber output path and
# `broadcast` is the lifecycle event path. Both are used through `try_send` /
# `send`, which need no reactor, so the reader and waiter threads stay plain OS
# threads and the crate is constructible outside a runtime.
tokio = { workspace = true }
# `PtyInfo`, `CreateInput` and `UpdateInput` are the wire shapes the HTTP routes
# in todos 64-70 serialize directly.
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Resolves a bare shell name on `PATH`, which is what `util/which.ts` does for
# every candidate in `Shell.list` and `Shell.preferred`.
which = { workspace = true }
# Connect tickets are opaque single-use secrets; v4 is the oracle's
# `crypto.randomUUID()` (`core/src/pty/ticket.ts:41`).
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `User::from_uid` wraps the thread-safe `getpwuid_r` account lookup without
# introducing first-party `unsafe` code. This sees NSS-backed users that are not
# necessarily materialized in `/etc/passwd`.
#
# `signal` adds `kill(pid, 0)`, which is how `recorded_process` asks whether a process
# another Zuno recorded still exists: a background row written before the ownership-claim
# protocol has no lock file to ask about, and its pid is the only thing left that can
# contradict "the owner is gone". The feature is additive on top of the workspace pin and
# pulls in no further crates (`signal = ["process"]`, both empty), and the call itself is
# `unsafe`-free here, which this crate's `unsafe_code = "forbid"` requires.
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

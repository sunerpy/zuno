[package]
name = "oc-catalog"
description = "Catalog of agents, skills, commands, and references discovered from disk and config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
futures = { workspace = true }
oc-config = { workspace = true }
oc-error = { workspace = true }
oc-paths = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
# Not a workspace pin on purpose: the root manifest ships no YAML parser and task 14
# was not allowed to edit it. `yaml-rust2` is the YAML 1.2 core-schema parser that
# matches js-yaml 4 (what gray-matter uses) on the scalar resolutions skill
# frontmatter depends on -- notably `yes` is a string, not a boolean. Promote this
# to `[workspace.dependencies]` the next time the root manifest is touched.
yaml-rust2 = "0.11.0"

[dev-dependencies]
insta = { workspace = true }
oc-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

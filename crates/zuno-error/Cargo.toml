[package]
name = "zuno-error"
description = "Typed error taxonomy shared by every crate; recovery decisions read data, never rendered messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Deliberately minimal. Every crate in the workspace depends on this one, so a
# dependency added here is a dependency added to all 33. `serde_json` earns its
# place because config, MCP, LSP and the database all decode JSON and a concrete
# `serde_json::Error` in `#[source]` position preserves line/column and
# `Error::classify()`, which a boxed source would erase.
[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }

# Test-only: the no-anyhow guard walks `crates/*/src/**`.
[dev-dependencies]
walkdir = { workspace = true }

[lints]
workspace = true

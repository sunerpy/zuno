[package]
name = "zuno-snapshot"
description = "Workspace snapshots and diffs used for revert and for tool-edit provenance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zuno-paths = { workspace = true }
serde = { workspace = true }
# The uncertain-restore record is durable recovery evidence a human reads, so it is
# persisted as JSON rather than an ad-hoc format invented here.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` powers the paused-clock assertion on the hourly gc cadence. Resolver
# 3 keeps a dev-only feature out of normal builds.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "zuno-observability"
description = "Bounded structured operational logs, secure debug sinks, and runtime span conventions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# `tracing-subscriber` provides target-aware filtering plus the optional plaintext
# and stderr formatters. The authoritative store has its own SQLite layer.
[dependencies]
zuno-error = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Test-only. `serde_json` is what makes the stdout assertion structural rather than
# a substring match: every captured stdout line has to *parse* as a protocol frame.
# `tempfile` gives each test its own log directory, so no test writes to the real
# `zuno_paths::log()`. `walkdir` powers the source guard in
# `tests/no_stdout_in_library.rs`.
[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true

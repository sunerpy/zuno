[package]
name = "oc-agent"
description = "Agent definitions, presets, and the sub-agent task boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# ---------------------------------------------------------------------------
# `oc-agent` MUST NOT depend on `oc-tools`.
#
# Todo 65 puts the `task` delegation tool in `oc-tools`, and that tool has to
# name this crate's roster to validate `subagent_type`. The edge therefore runs
# `oc-tools -> oc-agent`, and adding the reverse edge — even as a dev-dependency
# for a "do these tool ids exist" test — would make the pair mutually
# dependent. `builtin::GOVERNED_TOOL_IDS` states this crate's tool vocabulary
# locally instead; see its doc comment for where the cross-crate check belongs.
# ---------------------------------------------------------------------------
[dependencies]
oc-catalog = { workspace = true }
oc-config = { workspace = true }
oc-llm = { workspace = true }
oc-permission = { workspace = true }

[lints]
workspace = true

schema_version = 1
project = "zuno"
upstream_manifest = "UPSTREAM_CODEX.toml"

[[capabilities]]
id = "workflow-runtime"
status = "implemented"
ownership = "zuno-owned"
summary = "User-owned YAML workflows with pluggable graph and dynamic script engines."
zuno_paths = [
  "codex-rs/zuno-workflows",
  "codex-rs/app-server-protocol/src/protocol/v2/workflow.rs",
  "codex-rs/app-server/src/request_processors/workflows.rs",
  "codex-rs/app-server/src/request_processors/workflows",
  "codex-rs/plugin/src/load_outcome.rs",
  "codex-rs/plugin/src/manifest.rs",
]
shared_upstream_paths = [
  "codex-rs/app-server/src/message_processor.rs",
  "codex-rs/app-server/src/request_serialization.rs",
  "codex-rs/code-mode",
  "codex-rs/code-mode-host",
  "codex-rs/code-mode-protocol",
  "codex-rs/code-mode-runtime",
  "codex-rs/core/src/thread_manager.rs",
]
contracts = [
  "No business workflow is built into the application.",
  "frontend-consensus is not a reserved identifier, command, API method, packaged resource, default profile, or auto-installed plugin.",
  "Workflow definitions come only from explicit user, project, or plugin roots and are shared by every client surface.",
  "DSH is a design source for runtime composition, not an embedded runtime or wire/config compatibility target.",
  "Dynamic workflow scripts require independent authorization.",
  "Completed or uncertain side effects are never mechanically replayed.",
]

[[capabilities]]
id = "agent-backends"
status = "implemented"
ownership = "shared-modified"
summary = "One backend contract for native child threads, Claude Code, and ACP agents."
zuno_paths = [
  "codex-rs/ext/agent/src/one_shot.rs",
  "codex-rs/ext/agent/src/one_shot",
  "codex-rs/ext/agent/src/registry.rs",
  "codex-rs/ext/agent/src/registry",
  "codex-rs/plugin/src/agent_backend.rs",
  "codex-rs/plugin/src/load_outcome.rs",
  "codex-rs/plugin/src/manifest.rs",
  "codex-rs/core-plugins/src/agent_backends.rs",
  "codex-rs/core-plugins/src/loader.rs",
  "codex-rs/app-server/src/request_processors/workflows/backend_factory.rs",
  "codex-rs/app-server/src/request_processors/workflows/dispatcher.rs",
  "docs/zuno-plugin-agent-backends.md",
  "docs/zuno-plugin-agent-backends.zh-CN.md",
  "examples/zuno-plugins/agent-backends",
]
shared_upstream_paths = [
  "codex-rs/core/src/agent",
  "codex-rs/core/src/thread_manager.rs",
]
contracts = [
  "Codex development agents use in-process child threads by default.",
  "Agent references resolve through exact-generation provider factories; providers do not install business workflows or model routes.",
  "Enabled plugins may mount versioned, namespaced native Codex, Claude Code, or ACP factories through zuno.agent-backends/v1 declarations.",
  "Plugin declarations contain deployment process settings only; execution profiles remain authoritative for model, provider, reasoning, permission, and sandbox settings.",
  "Workflow admission persists and revalidates a non-secret backend, plugin generation, execution-profile, model, permission, and sandbox binding digest.",
  "Plugin backend generation covers declaration bytes and current-platform executable bytes; bare PATH commands are resolved, content-pinned in the factory binding, and rechecked before spawn.",
  "Environment variable values and credentials never enter plugin metadata or the workflow binding ledger.",
  "Unsupported backend capabilities fail before dispatch.",
]

[[capabilities]]
id = "native-acp"
status = "implemented"
ownership = "shared-modified"
summary = "Native ACP client surface over the same durable App Server thread and turn runtime."
zuno_paths = [
  "codex-rs/zuno-acp",
  "codex-rs/cli/src/acp_cmd.rs",
  "codex-rs/cli/tests/acp.rs",
  "docs/zuno-acp.md",
  "docs/zuno-acp.zh-CN.md",
]
shared_upstream_paths = [
  "codex-rs/app-server",
  "codex-rs/app-server-protocol",
]
contracts = [
  "ACP clients do not own a private agent loop.",
  "Turn interrupt, ordinary input, goal resume, and protected gates remain distinct.",
]

[[capabilities]]
id = "upstream-sync"
status = "implemented"
ownership = "zuno-owned"
summary = "Scheduled candidate-only replay of the reviewed Zuno delta onto each new exact Codex stable release, with automatic promotion after the human merge."
zuno_paths = [
  "UPSTREAM_CODEX.toml",
  "FORK_DELTA.toml",
  "FORK_REBRAND.toml",
  "scripts/zuno_upstream.py",
  "scripts/test_zuno_upstream.py",
  "scripts/zuno_rebrand.py",
  "scripts/test_zuno_rebrand.py",
  ".github/workflows/zuno-upstream-sync.yml",
  "docs/zuno-upstream-sync.md",
  "docs/zuno-upstream-sync.zh-CN.md",
]
shared_upstream_paths = []
contracts = [
  "The active Zuno branch and worktree are never mutated by synchronization.",
  "A dirty source is rejected before candidate preparation.",
  "The exact upstream tag, commit, and tree are verified before replay.",
  "The watcher tracks only the newest stable Codex tag, is idempotent per main commit, and reports replay conflicts as an issue instead of pushing.",
  "A conflict hunk is resolved by automation only when FORK_REBRAND.toml reproduces the Zuno side from the Codex baseline byte for byte; every other hunk waits for a human.",
  "Post-merge edits of a finalized candidate for the same release are reused for every path main has not changed since.",
  "Merging the candidate PR with a merge commit is the only manual step; nothing is merged automatically.",
  "A candidate is finalized as a merge whose first parent is the reviewed main commit and whose second parent is the exact upstream release commit recorded in UPSTREAM_CODEX.toml, even after manual conflict resolution.",
]

[[capabilities]]
id = "zuno-product-packaging"
status = "implemented"
ownership = "shared-modified"
summary = "Zuno product binary and cross-platform package target with a temporary Codex compatibility entrypoint."
zuno_paths = [
  "codex-rs/cli/src/codex.rs",
]
shared_upstream_paths = [
  "codex-rs/cli/Cargo.toml",
  "codex-rs/cli/src/main.rs",
  "codex-rs/cli/BUILD.bazel",
  "bazel/platforms/release_binaries.bzl",
  "scripts/codex_package",
  ".github/scripts/build-codex-package-archive.sh",
  "justfile",
]
contracts = [
  "The shipped product entrypoint, version identity, help, and shell completions are named Zuno.",
  "Zuno package archives contain bin/zuno and retain the proven Codex-derived companion layout.",
  "The Codex binary and release filegroup remain compatibility-only sync validation paths.",
]

[[capabilities]]
id = "server-strict-standalone"
status = "implemented"
ownership = "shared-modified"
summary = "Statically linked single-file Linux binary (code-mode host embedded) plus a strict approval mode for server troubleshooting."
zuno_paths = [
  "scripts/zuno_standalone_smoke.py",
  "scripts/zuno_standalone_live_check.py",
  "codex-rs/cli/src/embedded_code_mode_host.rs",
  "codex-rs/install-context/tests/code_mode_host_override.rs",
  "examples/zuno-config/server-strict.config.toml",
  "docs/zuno-server-strict.md",
  "docs/zuno-server-strict.zh-CN.md",
]
shared_upstream_paths = [
  "codex-rs/core/src/config/mod.rs",
  "codex-rs/app-server/src/lib.rs",
  "codex-rs/app-server/src/config_manager_service.rs",
  "codex-rs/utils/cli/src/approval_mode_cli_arg.rs",
  "codex-rs/protocol/src/protocol.rs",
  "codex-rs/core/src/unified_exec/stdin_approval.rs",
  "codex-rs/install-context/src/lib.rs",
  "codex-rs/cli/Cargo.toml",
  "codex-rs/cli/src/main.rs",
  ".github/workflows/zuno-ci.yml",
  ".github/workflows/zuno-release.yml",
]
contracts = [
  "approval_policy = \"untrusted\" is selectable in config, profiles, and --ask-for-approval; it prompts for every command and edit unless an explicit exec policy rule allows it.",
  "Every release publishes zuno-standalone-x86_64-unknown-linux-musl, a static ELF with no dynamic loader, attested and sealed with the platform packages.",
  "On musl targets codex-cli compiles codex-code-mode-host into zuno (a target-scoped dependency, not a cargo feature): the standalone binary serves code_mode_only models (the Kiro gpt-5.6 families) from a single file through an arg0 alias in the per-session helper directory.",
  "The PR gate runs the standalone strict-mode smoke (approval requested for ls, decline executes nothing; approval_policy = never runs it; write_stdin into an approved shell is reviewed again; a code_mode_only model reaches the embedded host and its exec_command still prompts) on the runner and inside a foreign container before sealing.",
]

[[capabilities]]
id = "zuno-ci-release"
status = "implemented"
ownership = "zuno-owned"
summary = "Public-runner PR gate and six-platform Zuno package release automation."
zuno_paths = [
  ".github/CODEOWNERS",
  ".github/workflows/zuno-ci.yml",
  ".github/workflows/zuno-release.yml",
  "scripts/check_zuno_update_boundaries.py",
  "scripts/smoke_zuno_package.py",
]
shared_upstream_paths = [
  ".github/workflows/blocking-ci.yml",
  ".github/workflows/postmerge-ci.yml",
  ".github/workflows/v8-canary.yml",
]
contracts = [
  "The protected main branch receives the required zuno/pr-gate context from public GitHub-hosted infrastructure.",
  "OpenAI-only CI remains manually available but does not run automatically in the Zuno repository.",
  "zuno-vX.Y.Z builds, natively smokes, attests, hashes, and publishes canonical Zuno packages for six OS/architecture targets.",
  "A merged same-repository upstream-sync/* pull request is promoted automatically from its sealed PR-gate bytes; every other promotion is an explicit dispatch.",
  "All inherited Codex installers, daemon updaters, and tag publishers fail closed in the independent Zuno repository.",
]

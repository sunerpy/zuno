# Copy this file to $ZUNO_HOME/kiro-sol.config.toml (or the compatible
# $CODEX_HOME location during the developer preview), set KIRO_PROVIDER_API_KEY,
# then select it with: zuno --profile kiro-sol
model_provider = "kiro-local"
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
model_context_window = 272000
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[model_providers.kiro-local]
name = "Kiro Provider"
base_url = "http://127.0.0.1:8787/v1"
env_key = "KIRO_PROVIDER_API_KEY"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 2
stream_max_retries = 2
stream_idle_timeout_ms = 300000
